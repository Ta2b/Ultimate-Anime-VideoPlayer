name: Release

# La seule entrée d'une release du lecteur : une étiquette v* poussée (ou donnée à la main). Dans l'ordre :
#   1. la garde (commit, version de l'étiquette, ci.yml vert) ;
#   2. Linux et Windows en parallèle, chacun avec son paquet TensorRT (construit et publié s'il manque : A28-01) ;
#      chacun joint ses fichiers à la release de l'étiquette, qui reste une préversion. macOS n'est plus construit : son
#      support est délaissé pour l'instant (décision de Tatoub, novembre 2026) ; release-macos.yml reste lançable à
#      la main ;
#   3. « publier », quand Linux et Windows ont réussi : vérifie que la
#      release a tout ce qu'elle doit avoir et que ses archives sont celles que les jobs de construction ont produites
#      (B51-07), signe le manifeste des mises à jour avec la clé Ed25519 du secret AJP_UPDATE_KEY (environnement protégé
#      « release ») et le joint (A28-02), puis, pour une release finale, la rend finale et « latest » si elle est plus
#      récente que l'actuelle (A28-03). Une préversion n'a pas de manifeste : le canal Préversions est retiré.
#
# Aucune étiquette ne se pose sans la demande de Tatoub (CLAUDE.md). Configuration du dépôt : docs/signature-des-releases.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à (re)construire et publier"
        required: true

# Les releases vivent dans un autre dépôt, écrites avec AJP_RELEASE_TOKEN seul : le jeton du dépôt des sources ne sert
# qu'à lire (B51-12).
permissions:
  contents: read
  actions: read

# Une seule release par étiquette à la fois, jamais annulée en cours (A28-15).
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  windows:
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    name: Publier
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    # La clé de signature n'existe que dans cet environnement : ses règles disent quelles étiquettes y ont accès.
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Les SHA-256 des archives telles que les jobs de construction les ont produites (vide : non construite).
      BUILT_LINUX: ${{ needs.linux.outputs.archive-sha256 }}
      BUILT_WINDOWS: ${{ needs.windows.outputs.archive-sha256 }}
      # macOS n'est plus construit : vide, son archive reste hors du manifeste (B51-11).
      BUILT_MACOS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Jeton de publication
        env:
          RELEASE_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: '[ -n "$RELEASE_TOKEN" ] || { echo "::error::secret AJP_RELEASE_TOKEN absent : pas de publication dans le dépôt des releases"; exit 1; }'
      - name: Fichiers de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/release/versions.env
          echo "AJP_RELEASE_REPO=$AJP_RELEASE_REPO" >>"$GITHUB_ENV"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          gh release download "$TAG" -R "$AJP_RELEASE_REPO" -D "$dir" \
            -p ajp-linux-x64.tar.gz -p ajp-windows-x64.zip -p ajp-macos-arm64.zip -p engines.lock
          # macOS non construite (échec, hors cible) : une archive restée d'un essai précédent ne se signe pas.
          [ -n "$BUILT_MACOS" ] || rm -f "$dir/ajp-macos-arm64.zip"
          # Ce qu'on signe est ce que la construction a produit, pas ce que la release contient maintenant (B51-07).
          tools/release/check-built-sums.sh "$dir" "ajp-linux-x64.tar.gz=$BUILT_LINUX" \
            "ajp-windows-x64.zip=$BUILT_WINDOWS" "ajp-macos-arm64.zip=$BUILT_MACOS"
          tools/release/check-release.sh "$TAG" "$dir"
      - name: Index NVIDIA signé
        env:
          UPDATE_KEY: ${{ secrets.AJP_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$UPDATE_KEY" ] || { echo "::error::secret AJP_UPDATE_KEY absent de l'environnement release (docs/signature-des-releases.md)"; exit 1; }
          dir="$RUNNER_TEMP/release"
          # L'index nomme le paquet TensorRT de l'engines.lock du paquet de chaque plateforme, jamais un
          # engines-nvidia.lock déjà joint à l'étiquette : celui-ci pouvait nommer un autre module (étiquette reposée
          # après un correctif) et gagner sur l'index du jour (B51-01).
          AJP_RELEASE_TAG="$TAG" tools/release/nvidia-index.sh "$dir/engines-nvidia.lock" "$dir/engines.lock" "$dir/engines-windows.lock"
          # Et l'index le prouve : même adresse, même SHA-256, même taille que ce que les paquets embarquent.
          tools/release/check-nvidia-index.sh "$dir/engines-nvidia.lock" "$dir/engines.lock" "$dir/engines-windows.lock"
          key="$RUNNER_TEMP/ajp-update-key.pem"
          trap 'rm -f "$key"' EXIT
          # PEM normalisé et vérifié contre la clé publique du lecteur (collage abîmé, base64 : update-key.sh).
          tools/release/update-key.sh "$key"
          # Le lecteur ne croit l'index que signé (A26-02).
          AJP_UPDATE_KEY="$key" tools/release/sign-file.sh "$dir/engines-nvidia.lock"
      - name: Manifeste signé
        if: ${{ !contains(env.TAG, '-') }}
        env:
          UPDATE_KEY: ${{ secrets.AJP_UPDATE_KEY }}
        run: |
          [ -n "$UPDATE_KEY" ] || { echo "::error::secret AJP_UPDATE_KEY absent de l'environnement release : pas de manifeste, pas de publication (docs/signature-des-releases.md)"; exit 1; }
          dir="$RUNNER_TEMP/release"
          key="$RUNNER_TEMP/ajp-update-key.pem"
          trap 'rm -f "$key"' EXIT
          # PEM normalisé et vérifié contre la clé publique du lecteur (collage abîmé, base64 : update-key.sh).
          tools/release/update-key.sh "$key"
          AJP_UPDATE_KEY="$key" tools/release/sign-manifest.sh "${TAG#v}" stable "$dir" \
            "https://github.com/$AJP_RELEASE_REPO/releases/download/$TAG" \
            "https://github.com/$AJP_RELEASE_REPO/releases/tag/$TAG"
          # La signature se vérifie avec la clé publique compilée dans le lecteur, archive par archive.
          pub="$(sed -n 's/^set(AJP_UPDATE_PUBKEY "\([0-9a-f]*\)".*/\1/p' src/app/CMakeLists.txt)"
          for archive in ajp-linux-x64.tar.gz ajp-windows-x64.zip ajp-macos-arm64.zip; do
            [ -f "$dir/$archive" ] || continue
            AJP_UPDATE_PUBKEY="$pub" tools/release/verify-download.sh "$dir/manifest.toml" "$dir/manifest.toml.sig" "$dir/$archive"
          done
          cat "$dir/manifest.toml" >>"$GITHUB_STEP_SUMMARY"
      - name: Publication
        env:
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release upload "$TAG" -R "$AJP_RELEASE_REPO" --clobber "$dir/engines-nvidia.lock" "$dir/engines-nvidia.lock.sig"
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" -R "$AJP_RELEASE_REPO" --prerelease=true --latest=false
            echo "préversion $TAG publiée (sans manifeste)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Le manifeste d'abord : la « latest » ne désigne jamais une release sans lui (A28-02, A28-03).
          gh release upload "$TAG" -R "$AJP_RELEASE_REPO" --clobber "$dir/manifest.toml" "$dir/manifest.toml.sig"
          # Une relance sur une étiquette plus ancienne ne ramène pas la « latest » en arrière.
          current="$(gh release view -R "$AJP_RELEASE_REPO" --json tagName -q .tagName 2>/dev/null || true)"
          latest=--latest
          if [ -n "$current" ] && [ "$current" != "$TAG" ] && \
             [ "$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sort -V | tail -1)" != "${TAG#v}" ]; then
            latest=--latest=false
            echo "::warning::$TAG est plus ancienne que la « latest » actuelle ($current) : elle le reste"
          fi
          gh release edit "$TAG" -R "$AJP_RELEASE_REPO" --prerelease=false "$latest"
          echo "release $TAG publiée ($latest)" | tee -a "$GITHUB_STEP_SUMMARY"
