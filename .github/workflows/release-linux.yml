name: Release Linux

# Une étiquette linux-v* (poussée, ou créée avec une release depuis GitHub) : le lecteur Linux
# (Vulkan) construit ici et joint à sa release, créée en préversion avec les notes de
# tools/release/notes/<étiquette>.md si elle n'existe pas encore. Le motif ne croise pas celui des releases Windows et
# macOS (v*), qui ne se lancent donc pas. Une poussée sur la branche release/linux construit le
# même paquet sans release : il reste en artefact de l'exécution.
on:
  push:
    tags: ["linux-v*"]
    branches: ["release/linux"]

permissions:
  contents: write

env:
  AJP_DEPS_PREFIX: ${{ github.workspace }}/../ajp-deps
  CC: gcc-13
  CXX: g++-13

jobs:
  package:
    name: Lecteur Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build nasm autoconf automake libtool pkg-config \
            python3-jinja2 patchelf p7zip-full libvulkan-dev glslc glslang-tools spirv-tools \
            libfreetype-dev libharfbuzz-dev libfribidi-dev libfontconfig-dev libshaderc-dev glslang-dev \
            liblcms2-dev libdav1d-dev libasound2-dev libpulse-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxfixes-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl-dev libudev-dev libdbus-1-dev \
            libva-dev
          pip install --user meson
      # Restauration et sauvegarde séparées : les dépendances construites restent en cache même
      # quand une étape suivante échoue (quota d'artefacts atteint, paquet refusé…).
      - id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}-${{ github.run_id }}
          restore-keys: |
            deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Paquet
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export AJP_RELEASE_TAG="$GITHUB_REF_NAME"
          tools/release/package-linux.sh "$RUNNER_TEMP/package"
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - name: Artefact
        if: github.ref_type == 'branch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: ajp-linux-x64
          path: |
            ${{ runner.temp }}/package/ajp-linux-x64.tar.gz
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
      - name: Préversion
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="tools/release/notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          assets=("$RUNNER_TEMP"/package/ajp-*.tar.gz "$RUNNER_TEMP/package/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "${assets[@]}"
          fi
