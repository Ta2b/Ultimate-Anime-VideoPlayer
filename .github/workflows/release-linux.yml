name: Release Linux

# Une étiquette linux-v* (poussée, ou créée avec une release depuis GitHub) : le lecteur Linux
# (Vulkan) construit ici et joint à sa release, créée en préversion avec les notes de
# tools/release/notes/<étiquette>.md si elle n'existe pas encore. Le motif ne croise pas celui des
# releases Windows et macOS (v*), qui ne se lancent donc pas. Une poussée sur la branche
# release/linux construit le même paquet sans release : il reste en artefact de l'exécution.
# Rien ne s'empaquette sans les règles (rules.yml) ni les tests unitaires sous Vulkan logiciel,
# construits avec les options livrées (tâche tests) : un commit étiqueté qui ne les passe pas n'a
# pas de release.
# Avant toute poussée : tools/release/preflight/run.sh fait la même construction et les mêmes
# tests dans un conteneur Ubuntu 24.04 local, avec toutes les erreurs d'un coup.
# Versions et paquets : tools/release/versions.env.
on:
  push:
    tags: ["linux-v*"]
    branches: ["release/linux"]

permissions:
  contents: write

# Une seule construction par branche ou étiquette : la plus récente remplace la précédente.
concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  CC: gcc-13
  CXX: g++-13

jobs:
  rules:
    uses: ./.github/workflows/rules.yml

  # Les tests avec les options de la version livrée (préréglage linux-release, tests activés),
  # comme l'étage tests du préflight : sans ROCm, dont les tests n'ont pas de GPU ici.
  tests:
    name: Tests (version livrée, Vulkan logiciel)
    runs-on: ubuntu-24.04
    env:
      AJP_TEST_VULKAN_VALIDATION: require
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_TESTS
          pip install --user meson
      - uses: actions/cache@v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - name: OpenVINO
        run: |
          source tools/release/versions.env
          pip install --user "openvino==$OPENVINO_VERSION"
          echo "OpenVINO_DIR=$(python3 -c 'from openvino.utils import get_cmake_path; print(get_cmake_path())')" >> "$GITHUB_ENV"
      - run: >-
          cmake --preset linux-release -B build/linux-release-tests -DAJP_BUILD_TESTS=ON
          -DAJP_WITH_CUDA=OFF -DAJP_WITH_OPENVINO=ON -DAJP_WITH_MIGRAPHX=OFF
      - run: cmake --build build/linux-release-tests
      - name: Tests (Vulkan logiciel sous Xvfb)
        run: xvfb-run -a ctest --test-dir build/linux-release-tests --output-on-failure -j "$(nproc)"

  package:
    name: Lecteur Linux (x64)
    needs: [rules, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_PACKAGE
          pip install --user meson
      # Restauration et sauvegarde séparées : les dépendances construites restent en cache même
      # quand une étape suivante échoue (quota d'artefacts atteint, paquet refusé…).
      - id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}-${{ github.run_id }}
          restore-keys: |
            deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # Moteurs facultatifs, empaquetés à côté du lecteur et listés dans engines.lock : OpenVINO
      # (GPU Intel) par sa roue PyPI, qui porte ses en-têtes et sa configuration CMake ; MIGraphX
      # (GPU AMD) par le dépôt ROCm d'AMD (tools/release/rocm-apt.sh). ROCm reste un prérequis du
      # système chez l'utilisateur : seul le module du backend est livré, lié au runtime HIP de
      # ROCm 7 (libamdhip64.so.7), qui ne se charge pas sur un ROCm 6. TensorRT se construit
      # ailleurs (licence NVIDIA).
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: OpenVINO
        run: |
          source tools/release/versions.env
          pip install --user "openvino==$OPENVINO_VERSION"
          echo "OpenVINO_DIR=$(python3 -c 'from openvino.utils import get_cmake_path; print(get_cmake_path())')" >> "$GITHUB_ENV"
      - name: ROCm et MIGraphX
        run: |
          tools/release/rocm-apt.sh
          # Les en-têtes et bibliothèques de l'API C de MIGraphX et du runtime HIP suffisent
          # (src/gpu/migraphx/CMakeLists.txt les cherche sans les fichiers de config de ROCm).
          sudo apt-get install -y -qq --no-install-recommends migraphx-dev hip-dev
          echo "CMAKE_PREFIX_PATH=/opt/rocm" >> "$GITHUB_ENV"
      # TensorRT et RTX HDR se construisent sur un poste NVIDIA (licence NVIDIA), joints à la release
      # avant l'étiquette avec leur index engines-nvidia.lock : leurs moteurs entrent dans l'index
      # du lecteur, et l'écran de bienvenue les propose.
      - name: Paquet
        env:
          AJP_WITH_OPENVINO: "ON"
          AJP_WITH_MIGRAPHX: "ON"
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export AJP_RELEASE_TAG="$GITHUB_REF_NAME"
            if gh release download "$GITHUB_REF_NAME" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP"; then
              export AJP_ENGINES_LOCK="$RUNNER_TEMP/engines-nvidia.lock"
            else
              echo "::warning::pas d'engines-nvidia.lock dans la release $GITHUB_REF_NAME : ni TensorRT ni RTX HDR"
            fi
          fi
          tools/release/package-linux.sh "$RUNNER_TEMP/package"
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - name: Artefact
        if: github.ref_type == 'branch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: ajp-linux-x64
          path: |
            ${{ runner.temp }}/package/ajp-linux-x64.tar.gz
            ${{ runner.temp }}/package/engines.lock
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
      - name: Préversion
        if: github.ref_type == 'tag'
        env:
          # Un dépôt public à part peut porter les releases (le lecteur télécharge ses moteurs sans
          # compte) : variable AJP_RELEASE_REPO et secret AJP_RELEASE_TOKEN qui peut y écrire.
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
        run: |
          notes="tools/release/notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          assets=("$RUNNER_TEMP"/package/ajp-*.tar.gz "$RUNNER_TEMP/package/engines.lock" "$RUNNER_TEMP/package/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" -R "$AJP_RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$AJP_RELEASE_REPO" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" -R "$AJP_RELEASE_REPO" --prerelease --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "${assets[@]}"
          fi
