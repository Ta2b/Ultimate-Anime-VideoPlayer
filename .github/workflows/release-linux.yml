name: Release Linux

# Une étiquette v* (poussée, ou créée avec une release depuis GitHub) : le lecteur Linux
# (Vulkan) construit ici et joint à la release de l'étiquette, créée en préversion avec les notes de
# tools/release/notes/<étiquette>.md si elle n'existe pas encore. Les builds Windows et macOS
# partent de la même étiquette et se joignent à la même release. Une poussée sur la branche
# release/linux construit le même paquet sans release : il reste en artefact de l'exécution.
# Rien ne s'empaquette sans les règles (rules.yml) ni, pour une étiquette, sans ci.yml vert sur son commit
# (release-guard.yml). Les tests sans GPU tournent sur le build même du paquet, préversions comprises.
# Versions et paquets : tools/release/versions.env.
# À la main : le paquet de la branche choisie, joint à la release de l'étiquette donnée (un
# correctif du lecteur dans une release déjà publiée), ou en artefact sans étiquette.
on:
  push:
    tags: ["v*"]
    branches: ["release/linux"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false

permissions:
  contents: write
  actions: read  # release-guard.yml lit les exécutions de ci.yml

# Une seule construction par branche ou étiquette : la plus récente remplace la précédente.
concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  # L'étiquette de la release visée : celle poussée, ou celle donnée à la main ; vide sinon.
  AJP_TAG: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && github.ref_name || inputs.tag || '' }}
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  CC: gcc-13
  CXX: g++-13

jobs:
  rules:
    uses: ./.github/workflows/rules.yml

  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      tag: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && github.ref_name || inputs.tag || '' }}

  package:
    name: Lecteur Linux (x64)
    needs: [rules, guard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_PACKAGE
          pip install --user "meson==$MESON_VERSION"
      # Restauration et sauvegarde séparées : les dépendances construites restent en cache même
      # quand une étape suivante échoue (quota d'artefacts atteint, paquet refusé…).
      - id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}-${{ github.run_id }}
          restore-keys: |
            deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}
            deps-player-gcc-13-
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # AMD et Intel passent par Vulkan (docs/moteurs.md).
      # TensorRT se construit ailleurs (licence NVIDIA).
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # TensorRT se construit sur un poste NVIDIA (le module et trtexec seulement : les bibliothèques de
      # NVIDIA se tirent de chez NVIDIA, lien direct). Le poste joint son paquet à la release AVANT
      # l'étiquette, avec son index engines-nvidia.lock (tools/release/attach-nvidia-linux.sh), que cette
      # étape reprend s'il existe : ses [[engine]] et [[vendor_file]] rejoignent l'engines.lock joint.
      - name: Paquet
        env:
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
        run: |
          if [ -n "$AJP_TAG" ]; then
            export AJP_RELEASE_TAG="$AJP_TAG"
            # Le paquet TensorRT est indépendant de l'étiquette : il vit dans la release « trt-<empreinte de ses
            # entrées> » (tools/release/trt-package.sh), construit une fois sur le poste NVIDIA. Un paquet joint
            # à l'étiquette elle-même (ancienne méthode) reste lu en second.
            fp="$(tools/release/trt-fingerprint.sh)"
            if gh release download "trt-$fp" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP" \
               || gh release download "$AJP_TAG" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP"; then
              export AJP_ENGINES_LOCK="$RUNNER_TEMP/engines-nvidia.lock"
            else
              echo "::warning::pas de paquet TensorRT pour l'empreinte $fp : sur le poste NVIDIA, tools/release/trt-package.sh, puis relancer ce workflow (docs/nvidia-linux.md)"
            fi
          fi
          tools/release/package-linux.sh "$RUNNER_TEMP/package"
      # Les tests sans GPU du build même du paquet (préréglage de test linux-release) : un échec arrête tout
      # avant l'artefact et la release, préversions comprises.
      - name: Tests sans GPU
        env:
          AJP_TEST_VULKAN_VALIDATION: "off"
        run: ctest --preset linux-release
      # Le même lecteur en un seul fichier (tools/release/appimage.sh) : à rendre exécutable et à lancer.
      - name: AppImage
        run: |
          tools/release/appimage.sh "$RUNNER_TEMP/package/ajp-linux-x64.tar.gz" "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage"
          (cd "$RUNNER_TEMP/package" && sha256sum ajp-linux-x86_64.AppImage >> SHA256SUMS)
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - name: Artefact
        if: env.AJP_TAG == ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 3
          name: ajp-linux-x64
          path: |
            ${{ runner.temp }}/package/ajp-linux-x64.tar.gz
            ${{ runner.temp }}/package/ajp-linux-x86_64.AppImage
            ${{ runner.temp }}/package/engines.lock
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
      - name: Préversion
        if: env.AJP_TAG != ''
        env:
          # Un dépôt public à part peut porter les releases (le lecteur télécharge ses moteurs sans
          # compte) : variable AJP_RELEASE_REPO et secret AJP_RELEASE_TOKEN qui peut y écrire.
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
        run: |
          notes="tools/release/notes/$AJP_TAG.md"
          [ -f "$notes" ] || notes=/dev/null
          assets=("$RUNNER_TEMP"/package/ajp-*.tar.gz "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage" "$RUNNER_TEMP/package/engines.lock" "$RUNNER_TEMP/package/SHA256SUMS")
          # Les constructions Windows et macOS de la même étiquette peuvent créer la release au même
          # moment : un refus de création ne compte que si la release n'existe toujours pas.
          gh release view "$AJP_TAG" -R "$AJP_RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create "$AJP_TAG" -R "$AJP_RELEASE_REPO" --prerelease --title "$AJP_TAG" \
              --notes-file "$notes" \
            || gh release view "$AJP_TAG" -R "$AJP_RELEASE_REPO" >/dev/null
          # Une étiquette sans « - » (v0.7.0) est une vraie release ; une rc reste une préversion. Les notes
          # reprennent celles du dépôt, même si la release a été créée avant (paquet TensorRT Windows joint).
          pre=true; [[ "$AJP_TAG" == *-* ]] || pre=false
          edit=(--prerelease="$pre"); [ "$pre" = true ] || edit+=(--latest)
          [ "$notes" = /dev/null ] || edit+=(--notes-file "$notes")
          gh release edit "$AJP_TAG" -R "$AJP_RELEASE_REPO" "${edit[@]}"
          # Une vraie release ne se réécrit pas : --clobber seulement pour une préversion (P1.16).
          clobber=(); [ "$pre" = true ] && clobber=(--clobber)
          gh release upload "$AJP_TAG" -R "$AJP_RELEASE_REPO" "${clobber[@]}" "${assets[@]}"
