name: Release Linux

# Le lecteur Linux (Vulkan) et son paquet TensorRT. Appelé par release.yml pour une étiquette v* (la seule entrée des
# releases, qui publie ensuite le manifeste et la « latest ») ; lancé à la main sans étiquette, ou par une poussée sur
# la branche release/linux, il construit le même paquet sans release : il reste en artefact de l'exécution. Lancé à
# la main avec une étiquette, il reconstruit le paquet de cette étiquette au commit de l'étiquette (la garde refuse
# tout autre commit) et le joint à sa release tant qu'elle n'est pas publiée.
#
# Rien ne s'empaquette sans les règles (rules.yml) ni, pour une étiquette, sans la garde (release-guard.yml : commit
# et version de l'étiquette, ci.yml vert). Le paquet TensorRT Linux vit dans la release « trt-<empreinte de ses
# entrées> » : trt-package.yml le construit et le publie s'il manque, avant le paquet du lecteur (A28-01). Une
# release finale sans TensorRT Linux échoue ; une préversion n'a qu'un avertissement. Les tests tournent sur le build
# même du paquet, rendu compris (Vulkan logiciel sous Xvfb), et les tests de découpe sur les modèles qu'il livre
# (A28-07). ci.yml n'a plus de tâche « version livrée » : c'était la même configuration, testée ici. Versions, paquets et dépôt
# des releases : tools/release/versions.env.
on:
  push:
    branches: ["release/linux"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    outputs:
      archive-sha256:
        description: "SHA-256 de ajp-linux-x64.tar.gz tel que cette construction l'a produit (B51-07)"
        value: ${{ jobs.package.outputs.archive-sha256 }}
      appimage-sha256:
        description: "SHA-256 de ajp-linux-x86_64.AppImage tel que cette construction l'a produit (C51-08)"
        value: ${{ jobs.package.outputs.appimage-sha256 }}

# Les releases vivent dans un autre dépôt, écrites avec AJP_RELEASE_TOKEN seul : le jeton du dépôt des sources ne sert
# qu'à lire, pour que vcpkg, Meson et les actions tierces n'en reçoivent pas un qui écrit (B51-12).
permissions:
  contents: read
  actions: read  # release-guard.yml lit les exécutions de ci.yml

# Une seule construction par étiquette (ou branche), commune à la poussée et au lancement à la main (A28-15). Une
# étiquette n'est jamais annulée en cours : deux constructions ne se remplacent pas l'une l'autre à moitié.
concurrency:
  group: release-linux-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

env:
  # L'étiquette de la release visée : celle donnée par release.yml ou à la main ; vide sinon.
  AJP_TAG: ${{ inputs.tag || '' }}
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  CC: gcc-13
  CXX: g++-13

jobs:
  rules:
    uses: ./.github/workflows/rules.yml

  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      tag: ${{ inputs.tag || '' }}

  # Le paquet TensorRT de l'empreinte courante : rien à faire s'il existe déjà, sinon construit et publié (A28-01).
  tensorrt:
    if: inputs.tag != ''
    needs: [rules, guard]
    uses: ./.github/workflows/trt-package.yml
    with:
      publier: true
      seulement-si-absent: true
    secrets: inherit

  package:
    name: Lecteur Linux (x64)
    needs: [rules, guard, tensorrt]
    # Sans étiquette, le job tensorrt est sauté : le paquet se construit quand même.
    if: ${{ !cancelled() && needs.rules.result == 'success' && needs.guard.result == 'success' && (needs.tensorrt.result == 'success' || needs.tensorrt.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      archive-sha256: ${{ steps.sums.outputs.archive }}
      appimage-sha256: ${{ steps.appimage.outputs.sha }}
    steps:
      # Le jeton d'écriture manque : échouer ici, pas après quarante minutes de construction (B51-12).
      - name: Jeton de publication
        if: inputs.tag != ''
        env:
          RELEASE_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: '[ -n "$RELEASE_TOKEN" ] || { echo "::error::secret AJP_RELEASE_TOKEN absent : pas de publication"; exit 1; }'
      # Le jeton du dépôt ne reste pas dans .git/config, où tout code tiers construit ensuite le lirait (A28-08).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_PACKAGE $APT_TESTS
          pip install --user --require-hashes -r tools/ci/requirements/meson.txt
          echo "AJP_RELEASE_REPO=$AJP_RELEASE_REPO" >>"$GITHUB_ENV"
      # L'index du paquet TensorRT, pris AVANT toute construction : le jeton n'est jamais dans l'environnement d'un
      # code tiers (A28-08). Le paquet vit dans la release « trt-<empreinte> » (trt-package.yml, job tensorrt) ; un
      # paquet joint à l'étiquette elle-même (ancienne méthode) reste lu en second.
      - name: Index TensorRT
        if: env.AJP_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fp="$(tools/release/trt-fingerprint.sh)"
          if gh release download "trt-$fp" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP" \
             || gh release download "$AJP_TAG" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP"; then
            echo "AJP_ENGINES_LOCK=$RUNNER_TEMP/engines-nvidia.lock" >>"$GITHUB_ENV"
          elif [[ "$AJP_TAG" == *-* ]]; then
            echo "::warning::pas de paquet TensorRT Linux pour l'empreinte $fp : préversion publiée sans lui"
          else
            echo "::error::pas de paquet TensorRT Linux pour l'empreinte $fp : une release finale en a toujours un (A28-01)"
            exit 1
          fi
      # Restauration et sauvegarde séparées : les dépendances construites restent en cache même
      # quand une étape suivante échoue (quota d'artefacts atteint, paquet refusé…).
      - id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}-${{ github.run_id }}
          # Une release ne restaure que les dépendances de sa recette exacte, jamais celles d'une autre (B51-13).
          restore-keys: |
            deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # AMD et Intel passent par Vulkan (docs/moteurs.md).
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Paquet
        run: |
          [ -z "$AJP_TAG" ] || export AJP_RELEASE_TAG="$AJP_TAG"
          tools/release/package-linux.sh "$RUNNER_TEMP/package"
      # Ce que « publier » retrouve dans la release avant de signer : le SHA-256 de l'archive telle que construite ici.
      - name: Empreinte de l'archive
        id: sums
        run: echo "archive=$(sha256sum "$RUNNER_TEMP/package/ajp-linux-x64.tar.gz" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      # Les tests du build même du paquet (préréglage de test linux-release), rendu compris sous Vulkan logiciel et
      # Xvfb (B28-13 : contraction en FMA, assert à effet de bord, comportement indéfini révélé par LTO) : un échec
      # arrête tout avant l'artefact et la release, préversions comprises. Couche de validation coupée ; un test sauté
      # ne passe pas pour réussi (plafond « linux-release » de skip-ceiling.txt).
      - name: Tests (Vulkan logiciel sous Xvfb)
        env:
          AJP_TEST_VULKAN_VALIDATION: "off"
        run: xvfb-run -a ctest --preset linux-release -j 3 --output-junit "$GITHUB_WORKSPACE/junit.xml"
      - name: Tests sautés
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" linux-release
      # Les modèles livrés passent la découpe du chemin fusionné (RIFE 4.26, 4.25, 4.22 lite, 4.25 lite, DistilDRBA et
      # son demi-flot) : un graphe que la découpe ne reconnaît plus arrête la release au lieu de ralentir l'utilisateur
      # (A28-07). Un saut compte comme un échec.
      - name: Découpe des modèles livrés
        if: env.AJP_TAG != ''
        run: |
          models="$RUNNER_TEMP/package/ajp-linux-x64/models/rife"
          for f in rife_v4.26.onnx rife_v4.25.onnx rife_v4.22_lite.onnx rife_v4.25_lite.onnx distil_drba_v2_lite.onnx \
            distil_drba_v2_lite_s05.onnx; do
            [ -f "$models/$f" ] || { echo "::error::modèle livré absent : $f"; exit 1; }
          done
          cmake --preset linux-release -DAJP_RIFE_MODEL_DIR="$models" -DAJP_DRBA_MODEL_DIR="$models"
          cmake --build --preset linux-release --target ajp_prepare_tests
          ctest --test-dir build/linux-release -R 'du catalogue se coupent' --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/models-junit.xml"
          ran="$(grep -c '<testcase' "$RUNNER_TEMP/models-junit.xml" || true)"
          skipped="$(grep -c '<skipped' "$RUNNER_TEMP/models-junit.xml" || true)"
          [ "$ran" -ge 2 ] && [ "$skipped" -eq 0 ] || { echo "::error::tests de découpe sautés ($skipped sur $ran)"; exit 1; }
      # Le même lecteur en un seul fichier (tools/release/appimage.sh) : à rendre exécutable et à lancer.
      - name: AppImage
        id: appimage
        run: |
          tools/release/appimage.sh "$RUNNER_TEMP/package/ajp-linux-x64.tar.gz" "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage"
          (cd "$RUNNER_TEMP/package" && sha256sum ajp-linux-x86_64.AppImage >> SHA256SUMS)
          # Ce que « publier » retrouve dans la release avant de le signer au manifeste (C51-08).
          echo "sha=$(sha256sum "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      # Le paquet lancé tel que l'utilisateur le recevra (B51-04) : extrait dans un dossier propre, ses bibliothèques
      # trouvées, le lecteur qui répond puis joue un clip en Vulkan logiciel jusqu'à un instantané, l'AppImage de même.
      # Un échec arrête tout avant la release.
      - name: Fumée du paquet
        run: |
          source tools/release/versions.env
          sudo apt-get install -y -qq $APT_TESTS ffmpeg
          tools/release/smoke-linux.sh "$RUNNER_TEMP/package/ajp-linux-x64.tar.gz" \
            "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage"
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - name: Artefact
        if: env.AJP_TAG == ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 3
          name: ajp-linux-x64
          path: |
            ${{ runner.temp }}/package/ajp-linux-x64.tar.gz
            ${{ runner.temp }}/package/ajp-linux-x86_64.AppImage
            ${{ runner.temp }}/package/engines.lock
            ${{ runner.temp }}/package/SHA256SUMS
          compression-level: 0
      # Joint à la release de l'étiquette, créée en préversion si elle n'existe pas. Elle reste une préversion : seul
      # le job « publier » de release.yml en fait une release finale et la « latest », une fois les trois plateformes
      # et le manifeste signé joints (A28-03).
      - name: Joindre à la release
        if: env.AJP_TAG != ''
        env:
          # Un dépôt public à part porte les releases (le lecteur télécharge ses moteurs sans compte) : secret
          # AJP_RELEASE_TOKEN qui peut y écrire. Seule étape à porter ce jeton, après toute construction (A28-08).
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        # Bloc « | » : dans un scalaire simple, YAML replie le saut de ligne en espace et la barre oblique échappait
        # cette espace (« \ /chemin… », fichier introuvable : v0.11.0-rc.2).
        run: |
          tools/release/attach-assets.sh "$AJP_TAG" "$RUNNER_TEMP"/package/ajp-*.tar.gz \
            "$RUNNER_TEMP/package/ajp-linux-x86_64.AppImage" "$RUNNER_TEMP/package/engines.lock" \
            "$RUNNER_TEMP/package/SHA256SUMS"
