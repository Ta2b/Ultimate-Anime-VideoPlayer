name: Règles

# Les règles du dépôt, sans construction : format, taille des fichiers, aucun getenv ni atoi, et chaque
# shader GLSL compilé en SPIR-V. Appelées par ci.yml (chaque poussée) et par release-linux.yml
# (avant tout paquet), pour que rien ne se livre sans les avoir passées.
on:
  workflow_call:

jobs:
  rules:
    name: Format et règles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang-format-20 glslc spirv-tools
      - name: clang-format
        run: git ls-files -z -- '*.cpp' '*.h' '*.cu' '*.cuh' ':!third_party' | xargs -0 -r clang-format-20 --dry-run --Werror
      - name: Taille des fichiers
        run: tools/ci/check-file-size.sh
      - name: Une seule version
        run: tools/ci/check-version.sh
      - name: Chemins en UTF-8
        run: tools/ci/check-path-string.sh
      - name: Journal sans chemin complet
        run: tools/ci/check-log-paths.sh
      - name: Commentaires sans nom ni date
        run: tools/ci/check-comments.sh
      - name: Actions épinglées
        run: tools/ci/check-pinned-actions.sh
      - name: Aucun getenv
        run: tools/ci/check-no-getenv.sh
      - name: Aucun atoi ni sscanf
        run: tools/ci/check-no-atoi.sh
      - name: Un seul exemplaire des utilitaires
        run: tools/ci/check-utilities.sh
      - name: Graphe des modules
        run: tools/ci/check-module-graph.py
      - name: Complexité des fonctions
        run: pip install --user -q lizard==1.25.1 && tools/ci/check-complexity.py
      - name: Shaders
        env:
          CXX: g++-13
        run: tools/ci/check-shaders.sh
