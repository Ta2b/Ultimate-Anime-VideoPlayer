# Exporte les graphes ONNX de DistilDRBA (flot entier et demi-flot) avec les scripts du dépôt, et les range en artefact. Avec
# « publier », les joint aussi à la release models-interp-1 du dépôt de releases, d'où
# tools/release/fetch-models.sh les prend pour les paquets.
#
# Les graphes sont comparés au réseau d'origine par le script lui-même : un écart fait échouer l'étape.
# L'export est reproductible (A46-02) : torch, onnx, onnxruntime et numpy sont épinglés, et chaque graphe produit
# doit avoir l'empreinte épinglée dans tools/release/fetch-models.sh. Un autre graphe (nouvelle version d'un outil,
# voulue) ne se publie qu'avec « nouvelle-empreinte » coché ; mettre alors à jour fetch-models.sh dans le même
# changement, sinon les paquets le refusent.
# GMFSS Fortuna n'est plus exporté : retiré du lecteur (0.10.0).
name: Exporter les modèles d'interpolation

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Joindre les graphes à la release models-interp-1 (écrit sur le dépôt de releases)"
        type: boolean
        default: false
      nouvelle-empreinte:
        description: "Accepter des graphes dont l'empreinte diffère de celle épinglée dans fetch-models.sh"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DISTIL_DRBA_COMMIT: db51bde

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install onnx==1.23.2 onnxruntime==1.31.1 numpy==2.5.4
      - name: DistilDRBA v2 lite (flot entier et demi-flot)
        run: |
          git clone https://github.com/routineLife1/DistilDRBA "$RUNNER_TEMP/DistilDRBA"
          git -C "$RUNNER_TEMP/DistilDRBA" checkout "$DISTIL_DRBA_COMMIT"
          python -I tools/drba/export_distil_drba.py "$RUNNER_TEMP/DistilDRBA" \
            --weights "$RUNNER_TEMP/DistilDRBA/weights/v2_lite.pkl" --out out/distil_drba_v2_lite.onnx
          python -I tools/drba/export_distil_drba.py "$RUNNER_TEMP/DistilDRBA" \
            --weights "$RUNNER_TEMP/DistilDRBA/weights/v2_lite.pkl" --scale 0.5 \
            --out out/distil_drba_v2_lite_s05.onnx
      - name: Empreintes
        env:
          NOUVELLE: ${{ inputs.nouvelle-empreinte }}
        run: |
          (cd out && sha256sum *.onnx | tee SHA256SUMS)
          # Chaque graphe contre son empreinte épinglée dans fetch-models.sh (ligne « <sha256> <nom> »).
          ecart=0
          while read -r sha name; do
            pinned="$(sed -n "s/^  \"\([0-9a-f]\{64\}\) $name\"$/\1/p" tools/release/fetch-models.sh)"
            if [ "$pinned" != "$sha" ]; then
              echo "::warning::$name : $sha produit, ${pinned:-rien} épinglé dans fetch-models.sh"
              ecart=1
            fi
          done < out/SHA256SUMS
          if [ "$ecart" -eq 1 ] && [ "$NOUVELLE" != true ]; then
            echo "::error::graphes différents de ceux épinglés : relancer avec « nouvelle-empreinte » si c'est voulu"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modeles-interpolation
          path: out/
          compression-level: 0
      - name: Release models-interp-1
        if: inputs.publier
        env:
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
        run: |
          gh release view models-interp-1 -R "$AJP_RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create models-interp-1 -R "$AJP_RELEASE_REPO" --latest=false \
                 --title "Modèles d'interpolation (DistilDRBA)" \
                 --notes "Graphes ONNX exportés par .github/workflows/export-interpolation-models.yml. DistilDRBA (routineLife1, MIT)."
          gh release upload models-interp-1 out/* -R "$AJP_RELEASE_REPO" --clobber
