# Exporte les graphes ONNX de DistilDRBA (flot entier et demi-flot) avec les scripts du dépôt, et les range en artefact. Avec
# « publier », les joint aussi à la release models-interp-1 du dépôt de releases, d'où
# tools/release/fetch-models.sh les prend pour les paquets.
#
# Les graphes sont comparés au réseau d'origine par le script lui-même : un écart fait échouer l'étape.
# GMFSS Fortuna n'est plus exporté : retiré du lecteur (0.10.0).
name: Exporter les modèles d'interpolation

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Joindre les graphes à la release models-interp-1 (écrit sur le dépôt de releases)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DISTIL_DRBA_COMMIT: db51bde

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy
      - name: DistilDRBA v2 lite (flot entier et demi-flot)
        run: |
          git clone https://github.com/routineLife1/DistilDRBA "$RUNNER_TEMP/DistilDRBA"
          git -C "$RUNNER_TEMP/DistilDRBA" checkout "$DISTIL_DRBA_COMMIT"
          python -I tools/drba/export_distil_drba.py "$RUNNER_TEMP/DistilDRBA" \
            --weights "$RUNNER_TEMP/DistilDRBA/weights/v2_lite.pkl" --out out/distil_drba_v2_lite.onnx
          python -I tools/drba/export_distil_drba.py "$RUNNER_TEMP/DistilDRBA" \
            --weights "$RUNNER_TEMP/DistilDRBA/weights/v2_lite.pkl" --scale 0.5 \
            --out out/distil_drba_v2_lite_s05.onnx
      - name: Empreintes
        run: cd out && sha256sum *.onnx | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modeles-interpolation
          path: out/
          compression-level: 0
      - name: Release models-interp-1
        if: inputs.publier
        env:
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN || github.token }}
        run: |
          gh release view models-interp-1 -R "$AJP_RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create models-interp-1 -R "$AJP_RELEASE_REPO" --latest=false \
                 --title "Modèles d'interpolation (DistilDRBA)" \
                 --notes "Graphes ONNX exportés par .github/workflows/export-interpolation-models.yml. DistilDRBA (routineLife1, MIT)."
          gh release upload models-interp-1 out/* -R "$AJP_RELEASE_REPO" --clobber
