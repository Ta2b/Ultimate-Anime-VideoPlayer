name: CI

# La CI ne se lance qu'à la main (décision de Tatoub, novembre 2026) : Actions > CI > Run workflow, sur main ou
# sur une branche. Plus rien de ce workflow sur les pull requests, les poussées ni la nuit (restent seules les
# tâches de veille : deps-watch, vendor-watch, resign-manifest, et release-linux/macos sur leurs branches `release/*`) : une PR passait toute la matrice, puis
# la repassait sur le commit fusionné, et chaque reprise de main dans la branche la relançait ; 37 min chaque fois.
# On fusionne un lot de PR, puis on lance la CI une fois sur main pour l'ensemble. Avant chaque étiquette, un
# lancement vert sur le commit à étiqueter est obligatoire : release-guard.yml exige ci.yml vert sur ce commit
# (docs/signature-des-releases.md). Une PR risquée (Windows, CUDA, CMake) se vérifie en la lançant sur sa branche.
# Deux étendues (entrée « complete ») :
# - courante (par défaut, environ 28 min) : règles, cœur (gcc, clang, asan-ubsan, tsan, GCC d'Arch), lecteur Linux
#   (lavapipe, clang-tidy, tsan sur les tests choisis, asan sur les cibles de fuzz), Windows MSVC, CUDA Linux et
#   Windows. Sur une autre branche que main, clang-tidy et la tâche CUDA de Windows ne regardent que ce qui
#   diffère de main ;
# - complète : en plus, asan-ubsan et tsan sur tout le lecteur au lieu des sous-ensembles, le lecteur avec le GCC
#   d'Arch et les moteurs fusionnés sur les modèles livrés. À lancer avant une release finale. La version livrée
#   (linux-release) se construit et se teste dans release-linux.yml, sur le paquet même.
# macOS n'a plus de tâche : son support est délaissé pour l'instant ; release-macos.yml reste lançable à la main.
# Versions et paquets : tools/release/versions.env.
on:
  workflow_dispatch:
    inputs:
      complete:
        description: "Étendue complète (sanitizers sur tout le lecteur, version livrée, Arch, moteurs fusionnés)"
        type: boolean
        default: false

# Lecture seule : rien ici n'écrit dans le dépôt (P1.20).
permissions:
  contents: read

# Une branche ne garde que son dernier lancement ; sur main, chaque commit lancé est testé jusqu'au bout (P1.35) :
# la garde de release exige ci.yml vert sur le commit de l'étiquette.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  APT_COMPILERS: clang-20 clang-tidy-20 clang-format-20
  CCACHE_DIR: ${{ github.workspace }}-ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 600M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  rules:
    uses: ./.github/workflows/rules.yml

  core:
    name: Cœur (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13, preset: linux-prefix-core }
          - { name: clang-20, cc: clang-20, cxx: clang++-20, preset: linux-prefix-core }
          - { name: asan-ubsan, cc: gcc-13, cxx: g++-13, preset: linux-prefix-asan-core }
          - { name: tsan, cc: gcc-13, cxx: g++-13, preset: linux-prefix-tsan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $APT_BUILD $APT_COMPILERS ccache
      # Un script de dépendances modifié restaure le préfixe précédent : ses marqueurs signés ne
      # font rebâtir que les dépendances dont la version ou les options ont changé.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-core-${{ matrix.cc }}-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-core-${{ matrix.cc }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-core-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-core-${{ matrix.name }}-
      - run: tools/deps/linux-from-source.sh --core "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-junit "$GITHUB_WORKSPACE/junit.xml"
      # Un test sauté ne passe pas pour réussi, ici non plus (B28-12) : plafond « core-<tâche> » de skip-ceiling.txt.
      - name: Tests sautés
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" core-${{ matrix.name }}

  # Le cœur avec le compilateur d'Arch (celui de CachyOS, le poste du propriétaire), en -Werror : un GCC plus
  # récent que celui de la CI apporte des avertissements que rien d'autre ne voit avant lui. Arch avance en
  # continu : la tâche signale sans bloquer (continue-on-error), à lire quand elle passe au rouge.
  arch:
    name: Cœur (GCC d'Arch)
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: archlinux:latest
    env:
      AJP_DEPS_PREFIX: /opt/ajp-deps
      CCACHE_DIR: /tmp/ccache
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git cmake ninja ccache pkgconf python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: gcc --version | head -n 1
      - run: tools/deps/linux-from-source.sh --core "$AJP_DEPS_PREFIX" /tmp/deps-src
      - run: cmake --preset linux-prefix-core
      - run: cmake --build --preset linux-prefix-core
      - run: ctest --preset linux-prefix-core --output-junit "$GITHUB_WORKSPACE/junit.xml"
      - name: Tests sautés
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" arch

  # Le lecteur entier avec le compilateur d'Arch (B28-11) : le cœur seul ne voyait pas les avertissements que le
  # GCC d'Arch ajoute dans src/app, src/render ou src/media, et le `cmake --build` de CachyOS échouait là où la CI
  # restait verte. Vulkan logiciel sous Xvfb pour les tests. Comme la tâche du cœur : signale sans bloquer. Étendue
  # complète seulement : sans cache de dépendances dans son conteneur, elle prend 28 min, la plus longue.
  arch-player:
    name: Lecteur (GCC d'Arch)
    if: inputs.complete
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: archlinux:latest
    env:
      AJP_DEPS_PREFIX: /opt/ajp-deps
      AJP_TEST_VULKAN_VALIDATION: "off"
      CCACHE_DIR: /tmp/ccache
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed base-devel git cmake ninja ccache pkgconf python meson nasm autoconf automake
          libtool python-jinja vulkan-headers vulkan-icd-loader vulkan-swrast shaderc glslang spirv-tools freetype2
          harfbuzz fribidi fontconfig lcms2 dav1d svt-av1 alsa-lib libpulse libx11 libxext libxrandr libxcursor libxi
          libxss libxtst libxfixes libxinerama libxkbcommon libxkbcommon-x11 wayland wayland-protocols libdecor
          libdrm libva mesa dbus xorg-server-xvfb xorg-xauth ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: gcc --version | head -n 1
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" /tmp/deps-src
      - run: cmake --preset linux-prefix
      - run: cmake --build --preset linux-prefix
      - run: xvfb-run -a ctest --preset linux-prefix -j 3 --output-junit "$GITHUB_WORKSPACE/junit.xml"
      - name: Tests sautés
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" arch-player

  # Tous les modules, lecteur compris, sous Xvfb avec Vulkan logiciel (lavapipe) et la couche de
  # validation exigée (AJP_TEST_VULKAN_VALIDATION, tests/support/vulkan_validation.h : chaque
  # erreur de la couche fait échouer l'exécutable) : une fois tel quel, une fois sous TSan. Sous
  # ASan et UBSan la couche est coupée pour la durée : les deux autres tâches la font déjà parler.
  # Les préréglages de test portent LSAN_OPTIONS, TSAN_OPTIONS et, sous ASan, le chargeur Vulkan
  # qui garde pilotes et couches chargés jusqu'à la sortie (tools/ci/lsan.supp dit pourquoi).
  # clang-tidy n'analyse que les fichiers que cette configuration compile (clang-tidy-src.sh) : sa
  # tâche est à part pour ne pas allonger celle des tests (15 min sur tout src/). Elle ne construit que les fichiers
  # générés que lit le compilateur (build-generated.sh), pas le lecteur.
  player:
    name: Lecteur Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # L'étendue courante passe tsan sur les tests choisis et asan sur les cibles de fuzz ; la complète, asan-ubsan et
    # tsan sur tout le lecteur, plus longs.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(!inputs.complete && '[{"name":"lavapipe","preset":"linux-prefix","tidy":false,"tests":true,"validation":"require"},{"name":"clang-tidy","preset":"linux-prefix","tidy":true,"tests":false,"validation":"require"},{"name":"tsan-pr","preset":"linux-prefix-tsan-player","test_preset":"linux-prefix-tsan-pr","tidy":false,"tests":true,"validation":"require"},{"name":"asan-fuzz","preset":"linux-prefix-asan","test_preset":"linux-prefix-asan-fuzz","tidy":false,"tests":true,"validation":"off"}]' || '[{"name":"lavapipe","preset":"linux-prefix","tidy":false,"tests":true,"validation":"require"},{"name":"clang-tidy","preset":"linux-prefix","tidy":true,"tests":false,"validation":"require"},{"name":"asan-ubsan","preset":"linux-prefix-asan","tidy":false,"tests":true,"validation":"off"},{"name":"tsan","preset":"linux-prefix-tsan-player","tidy":false,"tests":true,"validation":"require"}]') }}
    env:
      CC: gcc-13
      CXX: g++-13
      AJP_TEST_VULKAN_VALIDATION: ${{ matrix.validation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # clang-tidy ne regarde, hors de main, que ce qui diffère de main. La profondeur est une chaîne :
          # 0 est faux dans une expression GitHub, « tidy && 0 || 1 » valait toujours 1 et origin/main n'existait pas
          # (B28-05).
          fetch-depth: ${{ matrix.tidy && '0' || '1' }}
      # clang et clang-tidy (plusieurs centaines de Mo avec LLVM) ne servent qu'à la tâche
      # analysée ; clang-format reste à rules.yml. ccache : la construction repart du cache.
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_TESTS ccache ${{ matrix.tidy && 'clang-20 clang-tidy-20' || '' }}
          pip install --user "meson==$MESON_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          # TSan : son propre préfixe, où libass est instrumenté (B35-02) ; les autres tâches gardent le leur.
          key: deps-player-gcc-13-${{ startsWith(matrix.name, 'tsan') && 'tsan-' || '' }}${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-player-gcc-13-${{ startsWith(matrix.name, 'tsan') && 'tsan-' || '' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-player-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-player-${{ matrix.name }}-
      # libass, qui rend les scripts ASS venus de l'extérieur sur quatre fils, n'est vu de TSan que construit avec
      # lui : sans cela, la tâche « tsan » ne voyait aucune course dans son code multi-fils.
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
        env:
          AJP_LIBASS_CFLAGS: ${{ startsWith(matrix.name, 'tsan') && '-fsanitize=thread -g -O1' || '-O2 -g' }}
      - run: cmake --preset ${{ matrix.preset }}
      - if: ${{ !matrix.tidy }}
        run: cmake --build --preset ${{ matrix.preset }}
      # clang-tidy lit les sources et compile_commands.json : seuls les en-têtes et .inc générés doivent exister.
      - if: matrix.tidy
        run: tools/ci/build-generated.sh build/${{ matrix.preset }}
      - run: ccache -s
      - name: Tests (Vulkan logiciel sous Xvfb)
        if: matrix.tests
        run: xvfb-run -a ctest --preset ${{ matrix.test_preset || matrix.preset }} -j 3 --output-junit "$GITHUB_WORKSPACE/junit.xml"
      # Un test sauté ne compte plus pour réussi : leur nombre reste sous le plafond connu (P2.39).
      - name: Tests sautés
        if: matrix.tests
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" ${{ matrix.name }}
      # Les moteurs fusionnés Vulkan (RIFE, DistilDRBA) contre le réseau entier et contre l'interpréteur en
      # float, sur les modèles livrés (A45-11). Étendue complète seulement : les modèles (322 Mo,
      # jamais versionnés) se téléchargent et restent en cache, les deux tests prennent quelques minutes sur
      # lavapipe. Ailleurs ces tests restent cachés, et sautés sans modèle.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.name == 'lavapipe' && inputs.complete
        with:
          path: ~/.cache/ajp-release-models
          key: modeles-${{ hashFiles('tools/release/fetch-models.sh') }}
      - name: Moteurs fusionnés sur les modèles livrés
        if: matrix.name == 'lavapipe' && inputs.complete
        run: |
          sudo apt-get install -y -qq --no-install-recommends p7zip-full
          tools/release/fetch-models.sh "$HOME/ajp/models"
          # Sans modèle, les tests se sauteraient en silence : leur présence se vérifie ici.
          for model in rife_v4.26.onnx rife_v4.25.onnx rife_v4.22_lite.onnx rife_v4.25_lite.onnx distil_drba_v2_lite.onnx \
            distil_drba_v2_lite_s05.onnx; do
            test -f "$HOME/ajp/models/rife/$model" || { echo "modèle absent : $model" >&2; exit 1; }
          done
          # Lancés hors de ctest, donc hors de check-skips.sh : leur rapport JUnit est lu ici. Un cas sauté (stockage
          # 16 bits perdu par une mise à jour de Mesa, modèle introuvable) fait échouer le lancement au lieu de le laisser
          # vert, quel que soit le code de sortie de cette version de Catch2 quand tout est sauté (B28-04).
          fused="$RUNNER_TEMP/fused-junit.xml"
          xvfb-run -a build/linux-prefix/tests/unit/vk_backend/ajp_vk_backend_tests "[.rife_fused],[.drba_fused]" \
            -r junit -o "$fused"
          ran="$(grep -c '<testcase' "$fused" || true)"
          skipped="$(grep -c '<skipped' "$fused" || true)"
          echo "moteurs fusionnés : $ran cas, $skipped sautés"
          [ "$ran" -ge 2 ] && [ "$skipped" -eq 0 ] || { echo "::error::moteurs fusionnés sautés ou absents ($skipped sautés sur $ran)"; exit 1; }
      # Hors de main, seulement les fichiers qui diffèrent de main et ceux qui incluent un en-tête changé ; sur main,
      # tout src/.
      - name: clang-tidy sur src/
        if: matrix.tidy
        env:
          AJP_TIDY_BASE: ${{ github.ref != 'refs/heads/main' && 'origin/main' || '' }}
        run: tools/ci/clang-tidy-src.sh build/linux-prefix

  # MSVC et vcpkg, sans GPU : la construction avec /WX (une rupture de MSVC ou d'un port paraît ici
  # et non au moment de livrer), puis les tests des modules qui n'ouvrent pas d'appareil
  # (préréglage de test windows-ci). Mêmes chemins courts, triplet et cache de ports que
  # release-windows.yml ; restauration et sauvegarde séparées, la sauvegarde juste après une
  # installation de vcpkg complète, pour garder les ports compilés même quand la construction échoue.
  windows:
    name: Windows (MSVC)
    # Dans les deux étendues (P1.17). Un lancement sur main garde aussi à jour le cache vcpkg d'un manifeste ou de
    # ports changés, que lisent ensuite les autres branches.
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
      AJP_VCPKG: C:\v
      AJP_VCPKG_BUILDTREES: C:\vb
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vc,readwrite"
      AJP_VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # L'image du runner (donc la version de MSVC) entre dans la clé : vcpkg range ses paquets par une
      # empreinte qui la contient : le cache d'une autre image, restauré, ne sert plus. Une clé stable par
      # image, manifeste et ports, sans github.run_id : une entrée par combinaison au lieu d'une par
      # exécution, que sccache évinçait du quota du dépôt.
      - id: runner-image
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vc
          key: vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          # Même image, autres ports : les paquets dont l'empreinte n'a pas changé resservent.
          restore-keys: |
            vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-
      - name: vcpkg à la référence du manifeste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vc | Out-Null
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:AJP_VCPKG
          git -C $env:AJP_VCPKG checkout -q $baseline
          & "$env:AJP_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      # sccache (cache GitHub) pour cl.exe : /Z7 (CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) met
      # les informations de débogage dans les objets, seule forme que sccache sait mettre en cache.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Configuration
        id: configure
        shell: pwsh
        # msvc-dev-cmd pose le vcpkg de Visual Studio : le nôtre, à la référence du manifeste.
        run: |
          $env:VCPKG_ROOT = $env:AJP_VCPKG
          cmake --preset windows-ci "-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=$env:AJP_VCPKG_BUILDTREES" `
            "-DVCPKG_TARGET_TRIPLET=$env:AJP_VCPKG_TRIPLET" "-DVCPKG_HOST_TRIPLET=$env:AJP_VCPKG_TRIPLET" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) { throw "configuration" }
      # Sauvé dès que vcpkg a tout installé (la Configuration a réussi), même si la construction échoue
      # ensuite ; jamais un cache partiel d'une installation coupée, que la clé stable garderait pour de bon.
      # Rien à sauver quand la clé exacte vient d'être restaurée.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: C:\vc
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Construction
        shell: pwsh
        run: |
          cmake --build --preset windows-ci -- -k 0  # toutes les erreurs de MSVC en une passe
          if ($LASTEXITCODE -ne 0) { throw "construction" }
      - name: Tests sans GPU
        shell: pwsh
        run: |
          ctest --preset windows-ci --output-junit "$env:GITHUB_WORKSPACE/junit.xml"
          if ($LASTEXITCODE -ne 0) {
            # Les échecs seuls, relancés à la fin du journal : leur sortie se lit sans fouiller 4 000 lignes.
            ctest --preset windows-ci --rerun-failed --output-on-failure -j1
            throw "tests"
          }
      # Le runner n'a pas de GPU : les tests de rendu sautent. Un saut ne passe pas pour une réussite (C14) :
      # la liste s'écrit au résumé de la tâche, et leur nombre ne dépasse pas le plafond de skip-ceiling.txt.
      - name: Tests sautés
        if: always() && hashFiles('junit.xml') != ''
        shell: bash
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" windows | tee -a "$GITHUB_STEP_SUMMARY"

  # Le module TensorRT de Windows (MSVC + nvcc, AJP_WITH_CUDA=ON) construit sans carte, comme la tâche `cuda` le fait
  # sous Linux (B28-01) : un intrinsèque ou une extension de GCC que MSVC refuse passait les deux autres tâches et ne
  # cassait le paquet TensorRT de Windows, le seul moteur de la cible sous Windows 11, que le jour de la release. Sur
  # une branche, seulement quand elle touche ce que le module compile depuis main ; sur main, toujours.
  # Une seule architecture (sm_89) : les erreurs d'hôte de MSVC et de nvcc n'en dépendent pas, celles du code
  # d'appareil par architecture sont celles de la tâche Linux.
  windows-cuda:
    name: Windows (CUDA et TensorRT, MSVC)
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
      AJP_VCPKG: C:\v
      AJP_VCPKG_BUILDTREES: C:\vb
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vc,readwrite"
      AJP_VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref != 'refs/heads/main' && '0' || '1' }}
      - id: touched
        shell: bash
        env:
          BASE: ${{ github.ref != 'refs/heads/main' && 'origin/main' || '' }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "run=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          # Les chemins de l'empreinte du paquet TensorRT (tools/release/trt-fingerprint.sh) et ce qui construit Windows.
          if git diff --name-only "$BASE...HEAD" | grep -E '^(src/(core|gpu|kernels|prepare)/|third_party/cutlass/|cmake/|CMakeLists\.txt|CMakePresets\.json|vcpkg\.json|ports/|tools/deps/windows-tensorrt\.ps1|tools/release/versions\.env|\.github/workflows/ci\.yml)'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "Rien de ce que le module TensorRT compile n'a changé : tâche sautée." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - id: runner-image
        if: steps.touched.outputs.run == 'true'
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      # Le cache des ports de la tâche `windows` (même clé) : les ports sont les mêmes, seule la configuration change.
      - id: vcpkg-cache
        if: steps.touched.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vc
          key: vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: |
            vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-
      - name: vcpkg à la référence du manifeste
        if: steps.touched.outputs.run == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vc | Out-Null
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:AJP_VCPKG
          git -C $env:AJP_VCPKG checkout -q $baseline
          & "$env:AJP_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
      - if: steps.touched.outputs.run == 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - if: steps.touched.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # Le kit CUDA et TensorRT de NVIDIA (versions épinglées dans versions.env, empreintes vérifiées) : jetés avec la
      # tâche, rien n'en entre dans un paquet. Les lancer ici, c'est accepter leurs licences, comme release-windows.yml.
      - name: CUDA et TensorRT
        if: steps.touched.outputs.run == 'true'
        shell: pwsh
        run: pwsh tools/deps/windows-tensorrt.ps1 "$env:RUNNER_TEMP/nvidia"
      - name: Configuration
        if: steps.touched.outputs.run == 'true'
        id: configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:AJP_VCPKG
          cmake --preset windows-rtx "-DAJP_TENSORRT_ROOT=$env:AJP_TENSORRT_ROOT" "-DAJP_CUDA_ARCHITECTURES=89-real" `
            "-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=$env:AJP_VCPKG_BUILDTREES" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) { throw "configuration" }
      - name: Construction
        if: steps.touched.outputs.run == 'true'
        shell: pwsh
        run: |
          cmake --build --preset windows-rtx -- -k 0  # toutes les erreurs de MSVC et de nvcc en une passe
          if ($LASTEXITCODE -ne 0) { throw "construction" }

  # Le backend TensorRT et ses noyaux CUDA, compilés sans carte dans les deux étendues (P1.17) : le kit
  # CUDA et TensorRT viennent de NVIDIA (tools/deps/linux-tensorrt.sh) et ne sortent pas de la tâche.
  # Construction seule (linux-prefix-cuda), pour toutes les architectures livrées et pas sm_89 seule : un
  # noyau qui déborde sur sm_75 ou emploie un intrinsèque absent de Turing cassait le paquet TensorRT le jour
  # de la release. Les tests TensorRT demandent un GPU NVIDIA.
  cuda:
    name: Lecteur Linux (CUDA et TensorRT)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # La roue de TensorRT fait près de 4 Go.
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER ccache clang-tidy-20
          pip install --user "meson==$MESON_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-player-gcc-13-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-player-cuda-${{ github.sha }}
          restore-keys: ccache-player-cuda-
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - name: CUDA et TensorRT
        run: tools/deps/linux-tensorrt.sh "$RUNNER_TEMP/nvidia"
      - run: >-
          cmake --preset linux-prefix-cuda "-DAJP_TENSORRT_ROOT=$AJP_TENSORRT_ROOT"
          "-DAJP_CUDA_ARCHITECTURES=75-real;86-real;89-real;120-real;120-virtual"
      - run: cmake --build --preset linux-prefix-cuda
      # P5.8 : le backend TensorRT, que la tâche clang-tidy de Linux ne compile pas (ses .cpp ; nvcc garde les .cu).
      - name: clang-tidy sur le backend TensorRT
        env:
          AJP_TIDY_ONLY: ^src/gpu/cuda/
        run: tools/ci/clang-tidy-src.sh build/linux-prefix-cuda
