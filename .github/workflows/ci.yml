name: CI

# Chaque poussée sur main, cloud/** et release/** passe les règles (rules.yml). Les matrices de
# construction et de tests tournent sur main, sur chaque pull request, chaque nuit et à la
# demande (workflow_dispatch sur n'importe quelle branche) : une branche de travail ne les lance
# pas à chaque poussée (cloud.yml y construit le lecteur sous lavapipe quand le code change). Windows,
# macOS (Core ML) et CUDA (TensorRT) tournent sur chaque pull request, la nuit et à la demande (P1.17).
# Versions et paquets : tools/release/versions.env.
on:
  push:
    branches: [main, "cloud/**", "release/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Lecture seule : rien ici n'écrit dans le dépôt (P1.20).
permissions:
  contents: read

# Une PR ne garde que sa dernière poussée ; sur main, chaque commit est testé jusqu'au bout (P1.35) :
# la garde de release exige ci.yml vert sur le commit de l'étiquette.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  APT_COMPILERS: clang-20 clang-tidy-20 clang-format-20
  CCACHE_DIR: ${{ github.workspace }}-ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 600M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  rules:
    uses: ./.github/workflows/rules.yml

  core:
    name: Cœur (${{ matrix.name }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13, preset: linux-prefix-core }
          - { name: clang-20, cc: clang-20, cxx: clang++-20, preset: linux-prefix-core }
          - { name: asan-ubsan, cc: gcc-13, cxx: g++-13, preset: linux-prefix-asan-core }
          - { name: tsan, cc: gcc-13, cxx: g++-13, preset: linux-prefix-tsan }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $APT_BUILD $APT_COMPILERS ccache
      # Un script de dépendances modifié restaure le préfixe précédent : ses marqueurs signés ne
      # font rebâtir que les dépendances dont la version ou les options ont changé.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-core-${{ matrix.cc }}-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-core-${{ matrix.cc }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-core-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-core-${{ matrix.name }}-
      - run: tools/deps/linux-from-source.sh --core "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  # Le cœur avec le compilateur d'Arch (celui de CachyOS, le poste du propriétaire), en -Werror : un GCC plus
  # récent que celui de la CI apporte des avertissements que rien d'autre ne voit avant lui. Arch avance en
  # continu : la tâche signale sans bloquer (continue-on-error), à lire quand elle passe au rouge.
  arch:
    name: Cœur (GCC d'Arch)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: archlinux:latest
    env:
      AJP_DEPS_PREFIX: /opt/ajp-deps
      CCACHE_DIR: /tmp/ccache
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git cmake ninja ccache pkgconf python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: gcc --version | head -n 1
      - run: tools/deps/linux-from-source.sh --core "$AJP_DEPS_PREFIX" /tmp/deps-src
      - run: cmake --preset linux-prefix-core
      - run: cmake --build --preset linux-prefix-core
      - run: ctest --preset linux-prefix-core

  # Tous les modules, lecteur compris, sous Xvfb avec Vulkan logiciel (lavapipe) et la couche de
  # validation exigée (AJP_TEST_VULKAN_VALIDATION, tests/support/vulkan_validation.h : chaque
  # erreur de la couche fait échouer l'exécutable) : une fois tel quel, une fois sous TSan. Sous
  # ASan et UBSan la couche est coupée pour la durée : les deux autres tâches la font déjà parler.
  # Les préréglages de test portent LSAN_OPTIONS, TSAN_OPTIONS et, sous ASan, le chargeur Vulkan
  # qui garde pilotes et couches chargés jusqu'à la sortie (tools/ci/lsan.supp dit pourquoi).
  # clang-tidy n'analyse que les fichiers que cette configuration compile (clang-tidy-src.sh) : sa
  # tâche est à part pour ne pas allonger celle des tests (15 min sur tout src/). Elle tourne sur chaque
  # pull request, comme les autres.
  player:
    name: Lecteur Linux (${{ matrix.name }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Vitesse : une poussée dans main ne passe que lavapipe ; une pull request ajoute clang-tidy
    # (sur ses fichiers) ; asan-ubsan et tsan, plus longs, tournent la nuit, à la demande et avant
    # une vraie release (lancement à la main).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"lavapipe","preset":"linux-prefix","tidy":false,"tests":true,"validation":"require"}]' || github.event_name == 'pull_request' && '[{"name":"lavapipe","preset":"linux-prefix","tidy":false,"tests":true,"validation":"require"},{"name":"clang-tidy","preset":"linux-prefix","tidy":true,"tests":false,"validation":"require"},{"name":"tsan-pr","preset":"linux-prefix-tsan-player","test_preset":"linux-prefix-tsan-pr","tidy":false,"tests":true,"validation":"require"}]' || '[{"name":"lavapipe","preset":"linux-prefix","tidy":false,"tests":true,"validation":"require"},{"name":"clang-tidy","preset":"linux-prefix","tidy":true,"tests":false,"validation":"require"},{"name":"asan-ubsan","preset":"linux-prefix-asan","tidy":false,"tests":true,"validation":"off"},{"name":"tsan","preset":"linux-prefix-tsan-player","tidy":false,"tests":true,"validation":"require"}]') }}
    env:
      CC: gcc-13
      CXX: g++-13
      AJP_TEST_VULKAN_VALIDATION: ${{ matrix.validation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # clang-tidy ne regarde, sur une pull request, que les fichiers qu'elle change.
          fetch-depth: ${{ matrix.tidy && 0 || 1 }}
      # clang et clang-tidy (plusieurs centaines de Mo avec LLVM) ne servent qu'à la tâche
      # analysée ; clang-format reste à rules.yml. ccache : la construction repart du cache.
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_TESTS ccache ${{ matrix.tidy && 'clang-20 clang-tidy-20' || '' }}
          pip install --user "meson==$MESON_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-player-gcc-13-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-player-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-player-${{ matrix.name }}-
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ccache -s
      - name: Tests (Vulkan logiciel sous Xvfb)
        if: matrix.tests
        run: xvfb-run -a ctest --preset ${{ matrix.test_preset || matrix.preset }} -j 3 --output-junit "$GITHUB_WORKSPACE/junit.xml"
      # Un test sauté ne compte plus pour réussi : leur nombre reste sous le plafond connu (P2.39).
      - name: Tests sautés
        if: matrix.tests
        run: tools/ci/check-skips.sh "$GITHUB_WORKSPACE/junit.xml" ${{ matrix.name }}
      # Les moteurs fusionnés Vulkan (RIFE, DistilDRBA) contre le réseau entier et contre l'interpréteur en
      # float, sur les modèles livrés (A45-11). La nuit et à la demande seulement : les modèles (322 Mo,
      # jamais versionnés) se téléchargent et restent en cache, les deux tests prennent quelques minutes sur
      # lavapipe. Ailleurs ces tests restent cachés, et sautés sans modèle.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.name == 'lavapipe' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          path: ~/.cache/ajp-release-models
          key: modeles-${{ hashFiles('tools/release/fetch-models.sh') }}
      - name: Moteurs fusionnés sur les modèles livrés
        if: matrix.name == 'lavapipe' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          sudo apt-get install -y -qq --no-install-recommends p7zip-full
          tools/release/fetch-models.sh "$HOME/ajp/models"
          # Sans modèle, les tests se sauteraient en silence : leur présence se vérifie ici.
          for model in rife_v4.22_lite.onnx rife_v4.25.onnx distil_drba_v2_lite.onnx; do
            test -f "$HOME/ajp/models/rife/$model" || { echo "modèle absent : $model" >&2; exit 1; }
          done
          xvfb-run -a build/linux-prefix/tests/unit/vk_backend/ajp_vk_backend_tests "[.rife_fused],[.drba_fused]"
      # Une pull request n'analyse que les fichiers qu'elle change (tout src/ si un en-tête ou un
      # CMakeLists.txt change) ; main, la nuit et les lancements à la demande analysent tout.
      - name: clang-tidy sur src/
        if: matrix.tidy
        env:
          AJP_TIDY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: tools/ci/clang-tidy-src.sh build/linux-prefix

  # MSVC et vcpkg, sans GPU : la construction avec /WX (une rupture de MSVC ou d'un port paraît ici
  # et non au moment de livrer), puis les tests des modules qui n'ouvrent pas d'appareil
  # (préréglage de test windows-ci). Mêmes chemins courts, triplet et cache de ports que
  # release-windows.yml ; restauration et sauvegarde séparées, la sauvegarde juste après une
  # installation de vcpkg complète, pour garder les ports compilés même quand la construction échoue.
  windows:
    name: Windows (MSVC)
    # Chaque pull request, la nuit et à la demande (P1.17) : une rupture de MSVC se voit avant la fusion.
    # Aussi chaque poussée sur main : une PR ne lit que ses propres caches et ceux de main, et c'est ainsi
    # que le cache vcpkg d'un manifeste ou de ports changés existe pour les PR suivantes sans attendre la nuit.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
      AJP_VCPKG: C:\v
      AJP_VCPKG_BUILDTREES: C:\vb
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vc,readwrite"
      AJP_VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # L'image du runner (donc la version de MSVC) entre dans la clé : vcpkg range ses paquets par une
      # empreinte qui la contient : le cache d'une autre image, restauré, ne sert plus. Une clé stable par
      # image, manifeste et ports, sans github.run_id : une entrée par combinaison au lieu d'une par
      # exécution, que sccache évinçait du quota du dépôt.
      - id: runner-image
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vc
          key: vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          # Même image, autres ports : les paquets dont l'empreinte n'a pas changé resservent.
          restore-keys: |
            vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-
      - name: vcpkg à la référence du manifeste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vc | Out-Null
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:AJP_VCPKG
          git -C $env:AJP_VCPKG checkout -q $baseline
          & "$env:AJP_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      # sccache (cache GitHub) pour cl.exe : /Z7 (CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) met
      # les informations de débogage dans les objets, seule forme que sccache sait mettre en cache.
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Configuration
        id: configure
        shell: pwsh
        # msvc-dev-cmd pose le vcpkg de Visual Studio : le nôtre, à la référence du manifeste.
        run: |
          $env:VCPKG_ROOT = $env:AJP_VCPKG
          cmake --preset windows-ci "-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=$env:AJP_VCPKG_BUILDTREES" `
            "-DVCPKG_TARGET_TRIPLET=$env:AJP_VCPKG_TRIPLET" "-DVCPKG_HOST_TRIPLET=$env:AJP_VCPKG_TRIPLET" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) { throw "configuration" }
      # Sauvé dès que vcpkg a tout installé (la Configuration a réussi), même si la construction échoue
      # ensuite ; jamais un cache partiel d'une installation coupée, que la clé stable garderait pour de bon.
      # Rien à sauver quand la clé exacte vient d'être restaurée.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: C:\vc
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Construction
        shell: pwsh
        run: |
          cmake --build --preset windows-ci -- -k 0  # toutes les erreurs de MSVC en une passe
          if ($LASTEXITCODE -ne 0) { throw "construction" }
      - name: Tests sans GPU
        shell: pwsh
        run: |
          ctest --preset windows-ci
          if ($LASTEXITCODE -ne 0) {
            # Les échecs seuls, relancés à la fin du journal : leur sortie se lit sans fouiller 4 000 lignes.
            ctest --preset windows-ci --rerun-failed --output-on-failure -j1
            throw "tests"
          }

  # Le backend TensorRT et ses noyaux CUDA, compilés sans carte sur chaque pull request (P1.17) : le kit
  # CUDA et TensorRT viennent de NVIDIA (tools/deps/linux-tensorrt.sh) et ne sortent pas de la tâche.
  # Construction seule (linux-prefix-cuda), pour toutes les architectures livrées et pas sm_89 seule : un
  # noyau qui déborde sur sm_75 ou emploie un intrinsèque absent de Turing cassait le paquet TensorRT le jour
  # de la release, sans que la pull request l'ait vu. Les tests TensorRT demandent un GPU NVIDIA.
  cuda:
    name: Lecteur Linux (CUDA et TensorRT)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # La roue de TensorRT fait près de 4 Go.
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER ccache clang-tidy-20
          pip install --user "meson==$MESON_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}
          restore-keys: deps-player-gcc-13-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-player-cuda-${{ github.sha }}
          restore-keys: ccache-player-cuda-
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - name: CUDA et TensorRT
        run: tools/deps/linux-tensorrt.sh "$RUNNER_TEMP/nvidia"
      - run: >-
          cmake --preset linux-prefix-cuda "-DAJP_TENSORRT_ROOT=$AJP_TENSORRT_ROOT"
          "-DAJP_CUDA_ARCHITECTURES=75-real;86-real;89-real;120-real;120-virtual"
      - run: cmake --build --preset linux-prefix-cuda
      # P5.8 : le backend TensorRT, que la tâche clang-tidy de Linux ne compile pas (ses .cpp ; nvcc garde les .cu).
      - name: clang-tidy sur le backend TensorRT
        env:
          AJP_TIDY_ONLY: ^src/gpu/cuda/
        run: tools/ci/clang-tidy-src.sh build/linux-prefix-cuda

  # Core ML et le reste du lecteur macOS sur chaque pull request (P1.17), avec le cache de dépendances de
  # release-macos.yml : la construction et les tests sans GPU du préréglage macos-release.
  macos:
    name: macOS (Core ML)
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Le lanceur ccache du workflow vaut ici aussi, dépendances comprises.
      - run: brew install ccache
      - id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}-
            deps-macos-arm64-
      - run: tools/deps/macos-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - run: cmake --preset macos-release
      - run: cmake --build --preset macos-release
      - run: ctest --preset macos-release
      # P5.8 : ce que seul macOS compile (Core ML et ses pixels), avec le clang-tidy de Homebrew.
      - name: clang-tidy sur Core ML
        env:
          AJP_TIDY_ONLY: ^src/gpu/coreml/
        run: |
          brew install llvm@20
          tools/ci/clang-tidy-src.sh build/macos-release "$(brew --prefix llvm@20)/bin/clang-tidy"
