name: Reprendre les releases d'ajp

# Une fois, à la main (ADR 0016) : recopie des releases de l'ancien dépôt (KIRARI_LEGACY_RELEASE_REPO) vers celui
# des releases (KIRARI_RELEASE_REPO), fichiers compris. Par défaut models-interp-1, les graphes d'interpolation que
# tools/release/fetch-models.sh télécharge. Une release déjà là reçoit les fichiers qui lui manquent.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Étiquettes à recopier, séparées par des espaces"
        required: true
        default: "models-interp-1"

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recopie
        env:
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret AJP_RELEASE_TOKEN absent"; exit 1; }
          source tools/release/versions.env
          from="$KIRARI_LEGACY_RELEASE_REPO" to="$KIRARI_RELEASE_REPO"
          [ -n "$from" ] || { echo "::error::KIRARI_LEGACY_RELEASE_REPO vide dans tools/release/versions.env"; exit 1; }
          for tag in $TAGS; do
            dir="$RUNNER_TEMP/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -R "$from" -D "$dir"
            if ! gh release view "$tag" -R "$to" >/dev/null 2>&1; then
              title="$(gh release view "$tag" -R "$from" --json name -q .name)"
              gh release view "$tag" -R "$from" --json body -q .body >"$dir.notes"
              gh release create "$tag" -R "$to" --title "${title:-$tag}" --notes-file "$dir.notes" --latest=false
            fi
            gh release upload "$tag" -R "$to" "$dir"/* --clobber
            echo "$tag : $(ls "$dir" | wc -l) fichiers recopiés de $from vers $to" | tee -a "$GITHUB_STEP_SUMMARY"
          done
