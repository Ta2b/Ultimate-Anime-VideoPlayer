name: Release Windows

# Le lecteur universel Windows (backend Vulkan) et son paquet TensorRT. Appelé par release.yml pour une étiquette v*
# (la seule entrée des releases, qui publie ensuite le manifeste et la « latest ») ; lancé à la main sans étiquette, il
# construit le même paquet en artefact (et TensorRT en artefact si l'entrée tensorrt est cochée). Lancé à la main avec
# une étiquette, il reconstruit le paquet de cette étiquette au commit de l'étiquette (la garde refuse tout autre
# commit) et le joint à sa release tant qu'elle n'est pas publiée.
#
# Le paquet TensorRT Windows (notre module et trtexec.exe, sans fichier de NVIDIA) vit dans la release
# « trt-win-<empreinte de ses entrées> » (tools/release/trt-fingerprint.sh --windows), comme celui de Linux : il ne se
# construit que quand l'empreinte change, ici même, avant le paquet du lecteur, qui reprend son index (A28-01, A28-17).
# Pour une étiquette, le propriétaire du dépôt accepte les licences du kit CUDA et de TensorRT de NVIDIA en
# poussant l'étiquette (décision de Tatoub : chaque release a un paquet TensorRT Windows et Linux). Une release
# finale sans TensorRT Windows échoue ; une préversion n'a qu'un avertissement.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false
      tensorrt:
        description: "Sans étiquette : construire aussi TensorRT en artefact (j'accepte les licences du kit CUDA et de TensorRT de NVIDIA)"
        type: boolean
        default: false
      span_fp8:
        description: "Sans étiquette, avec TensorRT : construire aussi les noyaux CUTLASS du SPAN FP8 sous MSVC (essai 12.4)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    outputs:
      archive-sha256:
        description: "SHA-256 de ajp-windows-x64.zip tel que cette construction l'a produit (B51-07)"
        value: ${{ jobs.package.outputs.archive-sha256 }}

# Les releases vivent dans un autre dépôt, écrites avec AJP_RELEASE_TOKEN seul : le jeton du dépôt des sources ne sert
# qu'à lire, pour que vcpkg, MSVC et les actions tierces n'en reçoivent pas un qui écrit (B51-12).
permissions:
  contents: read
  actions: read  # release-guard.yml lit les exécutions de ci.yml

# Une seule construction par étiquette, commune à release.yml et au lancement à la main (A28-15).
concurrency:
  group: release-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

env:
  AJP_TAG: ${{ inputs.tag || '' }}

jobs:
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      tag: ${{ inputs.tag || '' }}

  # L'empreinte Windows se calcule sous Linux : les fins de ligne d'une extraction Windows la changeraient.
  trt-check:
    name: Paquet TensorRT Windows publié ?
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      fp: ${{ steps.fp.outputs.fp }}
      repo: ${{ steps.fp.outputs.repo }}
      build: ${{ steps.fp.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: fp
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TENSORRT: ${{ inputs.tensorrt }}
        run: |
          source tools/release/versions.env
          fp="$(tools/release/trt-fingerprint.sh --windows)"
          echo "fp=$fp" >>"$GITHUB_OUTPUT"
          echo "repo=$AJP_RELEASE_REPO" >>"$GITHUB_OUTPUT"
          build=false
          if [ -n "$AJP_TAG" ]; then
            gh release view "trt-win-$fp" -R "$AJP_RELEASE_REPO" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx engines-nvidia.lock || build=true
          elif [ "$IN_TENSORRT" = true ]; then
            build=true
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "empreinte TensorRT Windows : $fp ; construction : $build" | tee -a "$GITHUB_STEP_SUMMARY"

  tensorrt:
    name: TensorRT Windows (x64)
    needs: [trt-check]
    if: needs.trt-check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    # Un seul paquet TensorRT Windows à la fois, quelle que soit l'étiquette : deux étiquettes de même empreinte ne le
    # construisent plus en même temps ; la seconde attend, puis voit le paquet de la première (B51-02).
    concurrency:
      group: trt-package-windows
      cancel-in-progress: false
    env:
      AJP_VCPKG: C:\v
      AJP_VCPKG_BUILDTREES: C:\vb
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vc,readwrite"
      AJP_VCPKG_TRIPLET: x64-windows-release
      SCCACHE_GHA_ENABLED: "true"
      AJP_COMPILER_LAUNCHER: sccache
      FP: ${{ needs.trt-check.outputs.fp }}
      AJP_RELEASE_REPO: ${{ needs.trt-check.outputs.repo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Le contrôle du job trt-check date d'avant l'attente du verrou : le paquet a pu être publié entre-temps par une
      # autre étiquette de même empreinte. Rien ne se reconstruit ni ne se réécrit alors (B51-02).
      - name: Paquet publié depuis le contrôle ?
        if: env.AJP_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "trt-win-$FP" -R "$AJP_RELEASE_REPO" --json assets -q '.assets[].name' 2>/dev/null \
             | grep -qx engines-nvidia.lock; then
            echo "SKIP=1" >>"$GITHUB_ENV"
            echo "paquet TensorRT Windows trt-win-$FP déjà publié : rien à construire" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - id: runner-image
        if: env.SKIP != '1'
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.SKIP != '1'
        with:
          path: C:\vc
          key: vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: |
            vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-
      - name: vcpkg à la référence du manifeste
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vc | Out-Null
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:AJP_VCPKG
          git -C $env:AJP_VCPKG checkout -q $baseline
          & "$env:AJP_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: env.SKIP != '1'
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        if: env.SKIP != '1'
      - name: CUDA et TensorRT
        if: env.SKIP != '1'
        shell: pwsh
        run: pwsh tools/deps/windows-tensorrt.ps1 "$env:RUNNER_TEMP/nvidia"
      - name: Paquet TensorRT
        if: env.SKIP != '1'
        shell: pwsh
        env:
          IN_SPAN_FP8: ${{ inputs.span_fp8 }}
        run: |
          $env:VCPKG_ROOT = $env:AJP_VCPKG
          $env:AJP_WITH_CUDA = "ON"
          # Le SPAN FP8 sous MSVC reste un essai : jamais dans le paquet d'une empreinte publiée.
          if ($env:IN_SPAN_FP8 -eq "true" -and -not $env:AJP_TAG) { $env:AJP_WITH_SPAN_FP8 = "ON" }
          # Les liens de l'index nomment la release fixe de l'empreinte, celle que lit le paquet du lecteur.
          $env:AJP_RELEASE_TAG = "trt-win-$env:FP"
          $env:AJP_WITHOUT_MODELS = "1"
          pwsh tools/release/package-windows.ps1 "$env:RUNNER_TEMP/package"
          if ($LASTEXITCODE -ne 0) { throw "paquet TensorRT" }
          # Un paquet sans module ni trtexec.exe ne sert à rien : refusé ici plutôt que chez l'utilisateur (TRT-04).
          $members = tar tzf "$env:RUNNER_TEMP/package/ajp-engine-tensorrt-windows-x64.tar.gz"
          if (-not ($members -match 'ajp_backend_tensorrt\.dll$')) { throw "module TensorRT absent de l'archive" }
          if (-not ($members -match 'trtexec\.exe$')) { throw "trtexec.exe absent de l'archive" }
          pwsh tools/release/attach-nvidia-windows.ps1 "$env:RUNNER_TEMP/package" "trt-win-$env:FP"
          if ($LASTEXITCODE -ne 0) { throw "contrôle du paquet TensorRT" }
      # Seulement l'archive du moteur (notre module et trtexec.exe) et son index : le contrôle
      # d'attach-nvidia-windows.ps1 refuse une archive qui contient un fichier de NVIDIA.
      - name: Publication dans trt-win-${{ env.FP }}
        if: env.SKIP != '1' && env.AJP_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: pwsh tools/release/attach-nvidia-windows.ps1 "$env:RUNNER_TEMP/package" "trt-win-$env:FP" -Publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.SKIP != '1'
        continue-on-error: true
        with:
          retention-days: 7
          name: ajp-engine-tensorrt-windows-x64-${{ env.FP }}
          path: |
            ${{ runner.temp }}/package/ajp-engine-tensorrt-windows-x64.tar.gz
            ${{ runner.temp }}/package/engines-nvidia.lock

  package:
    name: Lecteur Windows (x64)
    needs: [trt-check, tensorrt]
    if: ${{ !cancelled() && needs.trt-check.result == 'success' && (needs.tensorrt.result == 'success' || needs.tensorrt.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 150
    outputs:
      archive-sha256: ${{ steps.sums.outputs.archive }}
    env:
      # Chemins courts : les sources de spirv-tools dépassent sinon les 260 caractères de MSVC.
      AJP_VCPKG: C:\v
      AJP_VCPKG_BUILDTREES: C:\vb
      VCPKG_BINARY_SOURCES: "clear;files,C:\\vc,readwrite"
      AJP_VCPKG_TRIPLET: x64-windows-release
      # sccache (cache GitHub) pour cl.exe : sans lui, les ~780 objets se recompilent à chaque release (~25 min).
      # En Release, sans informations de débogage, cl.exe est mis en cache tel quel.
      SCCACHE_GHA_ENABLED: "true"
      AJP_COMPILER_LAUNCHER: sccache
      FP: ${{ needs.trt-check.outputs.fp }}
      AJP_RELEASE_REPO: ${{ needs.trt-check.outputs.repo }}
    steps:
      # Le jeton d'écriture manque : échouer ici, pas après une heure de construction (B51-12).
      - name: Jeton de publication
        if: env.AJP_TAG != ''
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: '[ -n "$RELEASE_TOKEN" ] || { echo "::error::secret AJP_RELEASE_TOKEN absent : pas de publication"; exit 1; }'
      # Le jeton du dépôt ne reste pas dans .git/config, où les ports vcpkg le liraient (A28-08).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # L'index du paquet TensorRT Windows, pris AVANT toute construction : le jeton n'est jamais dans
      # l'environnement d'un code tiers (A28-08). Un paquet joint à l'étiquette elle-même reste lu en second.
      - name: Index TensorRT
        if: env.AJP_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "trt-win-$FP" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP" \
             || gh release download "$AJP_TAG" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP"; then
            echo "AJP_ENGINES_LOCK=$RUNNER_TEMP/engines-nvidia.lock" >>"$GITHUB_ENV"
          elif [[ "$AJP_TAG" == *-* ]]; then
            echo "::warning::pas de paquet TensorRT Windows pour l'empreinte $FP : préversion publiée sans lui"
          else
            echo "::error::pas de paquet TensorRT Windows pour l'empreinte $FP : une release finale en a toujours un (A28-01)"
            exit 1
          fi
      # Le même cache que ci.yml (même triplet) : une clé stable par image du runner, manifeste et ports
      # (voir ci.yml). Sauvé seulement après un paquet construit : jamais une installation coupée.
      - id: runner-image
        shell: pwsh
        run: '"image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vc
          key: vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: |
            vcpkg-windows-x64-${{ steps.runner-image.outputs.image }}-
      - name: vcpkg à la référence du manifeste
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\vc | Out-Null
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:AJP_VCPKG
          git -C $env:AJP_VCPKG checkout -q $baseline
          & "$env:AJP_VCPKG/bootstrap-vcpkg.bat" -disableMetrics
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      # AMD et Intel passent par Vulkan (docs/moteurs.md).
      - name: Paquet
        id: package
        shell: pwsh
        env:
          # Signature Authenticode (P7.1) : vide tant que le compte Trusted Signing n'existe pas.
          AJP_TS_ENDPOINT: ${{ vars.AJP_TS_ENDPOINT }}
          AJP_TS_ACCOUNT: ${{ vars.AJP_TS_ACCOUNT }}
          AJP_TS_PROFILE: ${{ vars.AJP_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AJP_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AJP_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AJP_AZURE_CLIENT_SECRET }}
        # msvc-dev-cmd pose le vcpkg de Visual Studio : le nôtre, à la référence du manifeste.
        run: |
          $env:VCPKG_ROOT = $env:AJP_VCPKG
          # Les liens d'engines.lock visent la release de cette étiquette : sans elle, le script
          # prend v<version du projet>, une release qui n'existe pas.
          if ($env:AJP_TAG) { $env:AJP_RELEASE_TAG = $env:AJP_TAG }
          pwsh tools/release/package-windows.ps1 "$env:RUNNER_TEMP/package"
          if ($LASTEXITCODE -ne 0) { throw "paquet" }
      # Ce que « publier » retrouve dans la release avant de signer : le SHA-256 du zip tel que construit ici (B51-07).
      - name: Empreinte de l'archive
        id: sums
        shell: pwsh
        run: '"archive=$((Get-FileHash "$env:RUNNER_TEMP/package/ajp-windows-x64.zip" -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT'
      # L'installeur (Inno Setup, installation pour l'utilisateur seul) à côté du zip portable.
      - name: Installeur
        shell: pwsh
        env:
          # Signature Authenticode (P7.1) : vide tant que le compte Trusted Signing n'existe pas.
          AJP_TS_ENDPOINT: ${{ vars.AJP_TS_ENDPOINT }}
          AJP_TS_ACCOUNT: ${{ vars.AJP_TS_ACCOUNT }}
          AJP_TS_PROFILE: ${{ vars.AJP_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AJP_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AJP_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AJP_AZURE_CLIENT_SECRET }}
        run: |
          # Version épinglée : un Inno Setup remplacé s'exécuterait chez chaque utilisateur (B51-13).
          choco install innosetup --version=6.7.1 -y --no-progress | Out-Null
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), '(?m)^  VERSION ([0-9.]+)\r?$').Groups[1].Value
          if (-not $version) { throw "version introuvable dans CMakeLists.txt" }
          # Une préversion affiche sa version entière (0.11.0-rc.1), comme le binaire (A28-04).
          if ($env:AJP_TAG -and $env:AJP_TAG.StartsWith("v$version-")) { $version = $env:AJP_TAG.Substring(1) }
          $out = "$env:RUNNER_TEMP/package"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSource=$out\ajp" "/DAppVer=$version" "/DOutput=$out" tools/release/windows/ajp.iss
          if ($LASTEXITCODE -ne 0) { throw "installeur" }
          pwsh tools/release/windows/sign.ps1 "$out/ajp-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signature de l'installeur" }
          $setup = Get-Item "$out/ajp-windows-x64-setup.exe"
          Add-Content -Path "$out/SHA256SUMS-windows.txt" -Value "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $($setup.Name)"
      # Le zip et l'installeur lancés tels que l'utilisateur les recevra (B51-04) : le zip extrait, l'installeur installé
      # en silence, ajp.exe qui répond dans les deux, puis désinstallé. Un échec arrête tout avant la release.
      - name: Fumée du paquet
        shell: pwsh
        run: |
          pwsh tools/release/smoke-windows.ps1 "$env:RUNNER_TEMP/package/ajp-windows-x64.zip" "$env:RUNNER_TEMP/package/ajp-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "fumée du paquet" }
      # Les tests sans GPU du build même du paquet (préréglage de test windows-release) : un échec
      # arrête tout avant l'artefact et la release, préversions comprises (P1.15).
      - name: Tests sans GPU
        shell: pwsh
        run: |
          ctest --preset windows-release
          if ($LASTEXITCODE -ne 0) { throw "tests" }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.package.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: C:\vc
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      # Les PDB du paquet (A39-04) : sans eux, un minidump de plantage ne se lit pas. Un artefact privé du
      # dépôt, gardé 90 jours, jamais joint à la release (ils portent les chemins de la machine de CI).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          retention-days: 90
          name: ajp-windows-x64-pdb
          path: build/windows-release/**/*.pdb
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.AJP_TAG == ''
        continue-on-error: true
        with:
          retention-days: 3
          name: ajp-windows-x64
          path: |
            ${{ runner.temp }}/package/ajp-*
            ${{ runner.temp }}/package/SHA256SUMS-windows.txt
      # Joint à la release de l'étiquette, qui reste une préversion : seul le job « publier » de release.yml la rend
      # finale et « latest » (A28-03). Seule étape à porter le jeton d'écriture, après toute construction (A28-08).
      - name: Joindre à la release
        if: env.AJP_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/package/ajp-*.zip "$RUNNER_TEMP"/package/ajp-*-setup.exe "$RUNNER_TEMP/package/SHA256SUMS-windows.txt")
          tools/release/attach-assets.sh "$AJP_TAG" "${assets[@]}"
