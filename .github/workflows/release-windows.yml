name: Release Windows

# Lancé à la main (ou par une étiquette v*) : le lecteur universel et son backend Vulkan, sans
# TensorRT (son paquet se construit sur le PC de référence, où TensorRT est installé).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false
  push:
    tags: ["v*"]
    branches: ["cloud/vulkan"]  # essai unique du portage ; retiré ensuite

permissions:
  contents: write

jobs:
  package:
    name: Lecteur Windows (x64)
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: vcpkg à la référence du manifeste
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone -q https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout -q $baseline
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Paquet
        shell: pwsh
        run: pwsh tools/release/package-windows.ps1 "$env:RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: ajp-windows-x64
          path: |
            ${{ runner.temp }}/package/ajp-windows-x64.zip
            ${{ runner.temp }}/package/SHA256SUMS-windows.txt
      - name: Joindre à la release
        if: github.event_name == 'push' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: gh release upload $env:TAG "$env:RUNNER_TEMP/package/ajp-windows-x64.zip" "$env:RUNNER_TEMP/package/SHA256SUMS-windows.txt" --clobber
