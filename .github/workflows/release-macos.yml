name: Release macOS

# Lancé à la main (ou par une étiquette v*) : les minutes macOS coûtent dix fois celles de Linux.
# Une poussée sur la branche release/macos construit le même paquet sans release : il reste en
# artefact de l'exécution, et les dépendances construites remplissent le cache.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false
  push:
    tags: ["v*"]
    branches: ["release/macos"]

permissions:
  contents: write

# Une seule construction par branche ou étiquette : la plus récente remplace la précédente.
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  AJP_DEPS_PREFIX: ${{ github.workspace }}/../ajp-deps

jobs:
  package:
    name: AJP.app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Restauration et sauvegarde séparées : les dépendances déjà construites (marquées .built-*)
      # restent en cache même quand la construction échoue plus loin.
      - id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh') }}-${{ github.run_id }}
          restore-keys: |
            deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh') }}-
      - run: tools/deps/macos-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - run: tools/release/package-macos.sh "$RUNNER_TEMP/package"
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: ajp-macos-arm64
          path: |
            ${{ runner.temp }}/package/ajp-macos-arm64.zip
            ${{ runner.temp }}/package/ajp-macos-arm64.zip.sha256
      - name: Joindre à la release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/package/ajp-macos-arm64.zip" \
            "$RUNNER_TEMP/package/ajp-macos-arm64.zip.sha256" --clobber
