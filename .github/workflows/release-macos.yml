name: Release macOS

# Appelé par release.yml pour une étiquette v* (la seule entrée des releases, qui publie ensuite le manifeste et la
# « latest ») ; lancé à la main sans étiquette, ou par une poussée sur la branche release/macos, il construit le même
# paquet sans release : il reste en artefact de l'exécution, et les dépendances construites remplissent le cache. Les
# minutes macOS coûtent dix fois celles de Linux.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release où joindre le paquet (vide : artefact seulement)"
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    outputs:
      archive-sha256:
        description: "SHA-256 de ajp-macos-arm64.zip tel que cette construction l'a produit (B51-07)"
        value: ${{ jobs.package.outputs.archive-sha256 }}
  push:
    branches: ["release/macos"]

permissions:
  contents: read
  actions: read  # release-guard.yml lit les exécutions de ci.yml

# Une seule construction par étiquette, commune à release.yml et au lancement à la main (A28-15). Une étiquette
# n'est jamais annulée en cours.
concurrency:
  group: release-macos-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

env:
  AJP_TAG: ${{ inputs.tag || '' }}
  # À côté de l'espace de travail, en chemin absolu : actions/cache refuse les chemins qui
  # contiennent « .. », et le cache des dépendances n'était jamais enregistré.
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps

jobs:
  guard:
    uses: ./.github/workflows/release-guard.yml
    with:
      tag: ${{ inputs.tag || '' }}

  package:
    name: AJP.app (Apple Silicon)
    outputs:
      archive-sha256: ${{ steps.sums.outputs.archive }}
    needs: [guard]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      # Le jeton du dépôt ne reste pas dans .git/config, où tout code tiers construit ensuite le lirait (A28-08).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Restauration et sauvegarde séparées : les dépendances déjà construites (marquées .built-*)
      # restent en cache même quand la construction échoue plus loin.
      - id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            deps-macos-arm64-${{ hashFiles('tools/deps/macos-from-source.sh', 'ports/libplacebo/*.patch', 'ports/libass/*.patch') }}-
            deps-macos-arm64-
      - run: tools/deps/macos-from-source.sh --locked "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      # Signature Developer ID et notarisation (P7.1), seulement si les secrets existent ; sinon ad hoc,
      # comme avant. Le certificat (.p12) va dans un trousseau jetable, la clé d'API dans un fichier.
      - name: Paquet
        env:
          MACOS_CERT_P12: ${{ secrets.AJP_MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.AJP_MACOS_CERT_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.AJP_MACOS_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.AJP_NOTARY_KEY_P8 }}
          AJP_NOTARY_KEY_ID: ${{ secrets.AJP_NOTARY_KEY_ID }}
          AJP_NOTARY_ISSUER: ${{ secrets.AJP_NOTARY_ISSUER }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_IDENTITY" ]; then
            keychain="$RUNNER_TEMP/ajp-signature.keychain-db"
            pass="$(openssl rand -hex 16)"
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            export AJP_MACOS_IDENTITY="$MACOS_IDENTITY"
            if [ -n "$NOTARY_KEY_P8" ]; then
              printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
              export AJP_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            fi
          else
            echo "::notice::pas de certificat Developer ID : signature ad hoc (P7.1)"
          fi
          [ -z "$AJP_TAG" ] || export AJP_RELEASE_TAG="$AJP_TAG"
          tools/release/package-macos.sh "$RUNNER_TEMP/package"
          rm -f "$RUNNER_TEMP/notary.p8"
      # Ce que « publier » retrouve dans la release avant de signer : le SHA-256 du zip tel que construit ici (B51-07).
      - name: Empreinte de l'archive
        id: sums
        run: echo "archive=$(shasum -a 256 "$RUNNER_TEMP/package/ajp-macos-arm64.zip" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      # spirv-val ne voit pas ce que seul Metal refuse : chaque shader passe par SPIRV-Cross et le
      # compilateur Metal, comme MoltenVK le fera à la création du pipeline.
      - name: Shaders en Metal
        run: tools/ci/check-msl.sh build/macos-release
      # Les tests sans GPU du build même du paquet (préréglage de test macos-release) : un échec
      # arrête tout avant l'artefact et la release.
      - name: Tests sans GPU
        # Préversions comprises (P1.15).
        run: ctest --preset macos-release
      # Le quota de stockage des artefacts du compte peut être plein : le paquet est construit quand même.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          retention-days: 3
          name: ajp-macos-arm64
          path: |
            ${{ runner.temp }}/package/ajp-macos-arm64.zip
            ${{ runner.temp }}/package/ajp-macos-arm64.zip.sha256
            ${{ runner.temp }}/package/ajp-macos-arm64.dmg
            ${{ runner.temp }}/package/ajp-macos-arm64.dmg.sha256
      # Joint à la release de l'étiquette, qui reste une préversion : seul le job « publier » de release.yml la rend
      # finale et « latest » (A28-03). Seule étape à porter le jeton d'écriture, après toute construction (A28-08).
      - name: Joindre à la release
        if: env.AJP_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.AJP_RELEASE_TOKEN }}
        run: |
          tools/release/attach-assets.sh "$AJP_TAG" "$RUNNER_TEMP/package/ajp-macos-arm64.zip" \
            "$RUNNER_TEMP/package/ajp-macos-arm64.zip.sha256" "$RUNNER_TEMP/package/ajp-macos-arm64.dmg" \
            "$RUNNER_TEMP/package/ajp-macos-arm64.dmg.sha256"
