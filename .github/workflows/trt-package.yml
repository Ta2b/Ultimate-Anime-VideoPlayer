# Le paquet TensorRT Linux construit par la CI (P1.19), sur un runner jetable, à la place du poste
# personnel : notre module (le kit CUDA compile sans carte) et trtexec, sorti de l'archive Linux de
# TensorRT à l'empreinte épinglée (tools/deps/linux-tensorrt.sh --trtexec). Rien de NVIDIA d'autre
# dans l'archive (package-linux.sh, lien direct). Le paquet part en artefact avec son empreinte, et
# se compare à celui de la release « trt-<empreinte> » s'il existe. Il n'est publié nulle part : la
# publication reste à tools/release/attach-nvidia-linux.sh, sur demande. Les tests sur GPU restent
# au poste NVIDIA (P7.3).
name: Paquet TensorRT Linux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AJP_DEPS_PREFIX: ${{ github.workspace }}-deps
  CC: gcc-13
  CXX: g++-13

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Place sur le disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Paquets système
        run: |
          source tools/release/versions.env
          sudo apt-get update -qq
          sudo apt-get install -y -qq $APT_BUILD $APT_PLAYER $APT_PACKAGE zstd
          pip install --user "meson==$MESON_VERSION"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AJP_DEPS_PREFIX }}
          key: deps-player-gcc-13-${{ hashFiles('tools/deps/linux-from-source.sh') }}
          restore-keys: deps-player-gcc-13-
      - run: tools/deps/linux-from-source.sh "$AJP_DEPS_PREFIX" "$RUNNER_TEMP/deps-src"
      - name: CUDA, TensorRT et trtexec
        run: tools/deps/linux-tensorrt.sh --trtexec "$RUNNER_TEMP/nvidia"
      - name: Paquet
        env:
          AJP_WITH_CUDA: "ON"
          AJP_WITHOUT_MODELS: "1"
          AJP_PACKAGE_NVIDIA: "1"
        run: |
          export LD_LIBRARY_PATH="$AJP_TENSORRT_ROOT/lib:${LD_LIBRARY_PATH:-}"
          tools/release/package-linux.sh "$RUNNER_TEMP/out"
          fp="$(tools/release/trt-fingerprint.sh)"
          archive="$RUNNER_TEMP/out/ajp-engine-tensorrt-linux-x64.tar.gz"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          tar -tzf "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo "empreinte des entrées : $fp ; archive : $sha"; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FP=$fp" >>"$GITHUB_ENV"
          echo "SHA=$sha" >>"$GITHUB_ENV"
      - name: Comparaison avec la release trt-${{ env.FP }}
        env:
          GH_TOKEN: ${{ github.token }}
          AJP_RELEASE_REPO: ${{ vars.AJP_RELEASE_REPO || 'Ta2b/ajp-releases' }}
        run: |
          if gh release download "trt-$FP" -R "$AJP_RELEASE_REPO" -p engines-nvidia.lock -D "$RUNNER_TEMP/rel" 2>/dev/null; then
            published="$(grep -A4 'id = "tensorrt"' "$RUNNER_TEMP/rel/engines-nvidia.lock" | sed -n 's/^sha256 = "\(.*\)"/\1/p' | head -1)"
            echo "publiée : $published ; CI : $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$published" = "$SHA" ] || echo "::warning::archive différente de la release trt-$FP (construction non reproductible, ou autre trtexec)"
          else
            echo "pas de release trt-$FP : rien à comparer" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ajp-engine-tensorrt-linux-x64-${{ env.FP }}
          path: |
            ${{ runner.temp }}/out/ajp-engine-tensorrt-linux-x64.tar.gz
            ${{ runner.temp }}/out/ajp-linux-x64/engines.lock
