name: Qualité

# Le banc de qualité des réseaux livrés (tools/bench/qualite, docs/banc-qualite.md), sans carte graphique : chaque
# graphe FP16 contre sa référence FP32 et contre la vraie image, sous ONNX Runtime. Il échoue quand un réseau passe
# sous un seuil de tools/bench/qualite/seuils.json. Il tourne quand le banc, un script de modèles ou la liste des
# modèles livrés change, et chaque nuit (un modèle publié sous le même nom se verrait).
on:
  push:
    branches: [main]
    paths:
      - "tools/bench/qualite/**"
      - "tools/bench/qualite.sh"
      - "tools/release/fetch-models.sh"
      - "tools/rife/**"
      - "tools/drba/**"
      - "data/calibration/**"
      - ".github/workflows/qualite.yml"
  pull_request:
    paths:
      - "tools/bench/qualite/**"
      - "tools/bench/qualite.sh"
      - "tools/release/fetch-models.sh"
      - "tools/rife/**"
      - "tools/drba/**"
      - "data/calibration/**"
      - ".github/workflows/qualite.yml"
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  banc:
    name: Réseaux contre FP32 (processeur)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.5.3 onnx==1.23.2 onnxruntime==1.29.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg p7zip-full
      - name: Tests du banc
        run: python -I tools/bench/qualite/test_banc.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ajp-release-models
          key: modeles-${{ hashFiles('tools/release/fetch-models.sh') }}
      - name: Banc
        run: tools/bench/qualite.sh --md "$RUNNER_TEMP/banc-qualite.md" --json "$RUNNER_TEMP/banc-qualite.json"
      - name: Résumé
        if: always()
        run: cat "$RUNNER_TEMP/banc-qualite.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: banc-qualite
          path: |
            ${{ runner.temp }}/banc-qualite.md
            ${{ runner.temp }}/banc-qualite.json
          if-no-files-found: ignore
