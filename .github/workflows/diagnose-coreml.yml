name: Diagnostic Core ML

# Les modèles livrés, ouverts par ONNX Runtime et son fournisseur CoreML comme le lecteur les ouvre
# (tools/ci/coreml_report.py) : les nœuds laissés au CPU, l'unité de chaque opération du plan de
# Core ML, le temps d'une exécution. À la main, ou quand le script ou ce fichier changent.
on:
  workflow_dispatch:
  push:
    branches: ["cloud/**"]
    paths:
      - tools/ci/coreml_report.py
      - .github/workflows/diagnose-coreml.yml

permissions:
  contents: read

concurrency:
  group: diagnose-coreml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Core ML (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # La version d'ONNX Runtime du paquet macOS (tools/deps/macos-from-source.sh).
      - run: python -m pip install onnxruntime==1.31.0 onnx==1.17.0 numpy
      - run: brew install sevenzip
      - run: tools/release/fetch-models.sh "$RUNNER_TEMP/models" "$RUNNER_TEMP/models-cache"
      - name: Rapport
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | sed -n '1,20p'
          python -I tools/ci/coreml_report.py "$RUNNER_TEMP/models" | tee "$RUNNER_TEMP/coreml-report.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          retention-days: 7
          name: coreml-report
          path: ${{ runner.temp }}/coreml-report.txt
