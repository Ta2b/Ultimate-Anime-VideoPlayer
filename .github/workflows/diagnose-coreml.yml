name: Diagnostic Core ML

# Les modèles livrés, ouverts par ONNX Runtime et son fournisseur CoreML comme le lecteur les ouvre
# (tools/ci/coreml_report.py) : les nœuds laissés au CPU, l'unité de chaque opération du plan de
# Core ML, le temps d'une exécution. À la main, ou quand le script ou ce fichier changent.
on:
  workflow_dispatch:
  push:
    branches: ["cloud/**"]
    paths:
      - tools/ci/coreml_report.py
      - .github/workflows/diagnose-coreml.yml

permissions:
  contents: read

concurrency:
  group: diagnose-coreml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Core ML (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La version d'ONNX Runtime du paquet macOS (tools/deps/macos-from-source.sh), et la dernière
      # à côté : le fournisseur CoreML y prend-il les graphes FP16 ?
      - run: python -m pip install onnxruntime==1.22.0 onnx==1.17.0 numpy
      - run: |
          python -m venv "$RUNNER_TEMP/ort-new"
          "$RUNNER_TEMP/ort-new/bin/python" -m pip install onnxruntime==1.31.0 onnx==1.17.0 numpy
      - run: brew install sevenzip
      - run: tools/release/fetch-models.sh "$RUNNER_TEMP/models" "$RUNNER_TEMP/models-cache"
      - name: Rapport
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | sed -n '1,20p'
          only=(--only "SPAN Performance 540p" --only "RIFE 4.25 720p")
          python -I tools/ci/coreml_report.py "$RUNNER_TEMP/models" "${only[@]}" | tee "$RUNNER_TEMP/coreml-report.txt"
          "$RUNNER_TEMP/ort-new/bin/python" -I tools/ci/coreml_report.py "$RUNNER_TEMP/models" "${only[@]}" \
            | tee -a "$RUNNER_TEMP/coreml-report.txt"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: coreml-report
          path: ${{ runner.temp }}/coreml-report.txt
