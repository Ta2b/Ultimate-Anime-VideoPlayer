name: Garde de release

# Appelé par les workflows de release avant toute construction (P1.15, P1.16). Une étiquette donnée :
# - le commit construit doit être celui de l'étiquette (pas une branche choisie à la main) ;
# - l'étiquette doit dire la version de project() dans CMakeLists.txt : v<VERSION>, ou v<VERSION>-<suffixe> pour une
#   préversion (A28-04) ; le suffixe est compilé dans le binaire (package-*.sh, AJP_VERSION_SUFFIX) ;
# - une release finale a une clé de secours compilée (C51-04) et une CI verte d'étendue complète ; une préversion se
#   contente d'une CI verte quelconque (C51-07);
# - ci.yml doit être vert sur ce commit. Une étiquette poussée en même temps que son commit sur main attend la fin
#   de ci.yml : relancer alors la release.
# Sans étiquette (artefact seulement), rien n'est vérifié.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Étiquette, version et CI verte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.tag != ''
        with:
          persist-credentials: false
      - name: Version de l'étiquette
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: tools/ci/check-version.sh "$TAG"
      # Une release finale (étiquette sans « - ») sans notes partirait avec des notes vides (B51-15).
      - name: Notes de la release
        if: inputs.tag != '' && !contains(inputs.tag, '-')
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -s "tools/release/notes/$TAG.md" ] \
            || { echo "::error::tools/release/notes/$TAG.md manque ou est vide : une release finale a ses notes"; exit 1; }
      - name: Clé de secours
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: tools/ci/check-backup-key.sh "$TAG"
      - name: Commit de l'étiquette, ci.yml vert
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" -q .sha)" \
            || { echo "::error::étiquette $TAG introuvable dans $GITHUB_REPOSITORY"; exit 1; }
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::le commit construit ($GITHUB_SHA) n'est pas celui de l'étiquette $TAG ($tagged)"
            exit 1
          fi
          # Une release finale exige l'étendue complète (le titre du lancement la dit : run-name de ci.yml), une
          # préversion n'importe quel lancement vert (C51-07).
          select='.'
          [[ "$TAG" == *-* ]] || select='select(.displayTitle | contains("(complète)"))'
          green="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --limit 100 --json displayTitle -q "[.[] | $select] | length")"
          if [ "${green:-0}" -eq 0 ]; then
            if [[ "$TAG" == *-* ]]; then echo "::error::ci.yml n'est pas vert sur $GITHUB_SHA : pas de release"
            else echo "::error::ci.yml n'est pas vert, en étendue complète, sur $GITHUB_SHA : lancer la CI avec « Étendue complète » avant une release finale"; fi
            exit 1
          fi
