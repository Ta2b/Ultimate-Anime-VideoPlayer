# Les champs que demande P1.33. Le journal vient du bouton « Report a problem » du menu (Général),
# qui le copie nettoyé : dossier personnel remplacé par ~, noms de fichiers seuls.
name: Bug report / Problème
description: Something does not work as expected. / Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / Ce qui se passe
      description: What you did, what you expected, what you saw. / Ce que vous avez fait, attendu, vu.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ajp version / Version
      placeholder: "0.9.1 (menu General, Application page)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System / Système
      options: [Windows 11, Windows 10, Linux, macOS]
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: System version / Version du système
      placeholder: "Windows 11 24H2, Fedora 43 KDE Wayland, macOS 15.5…"
  - type: input
    id: gpu
    attributes:
      label: Graphics card / Carte graphique
      placeholder: "RTX 4070, RX 7800 XT, Arc B580, M3…"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver / Pilote
      placeholder: "NVIDIA 590.12, Mesa 26.1, Adrenalin 26.3…"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / Moteur
      options: [Vulkan, TensorRT, Core ML, "Don't know / Je ne sais pas"]
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Quality level / Niveau
      options: [Auto, Fast / Rapide, Normal, Quality / Qualité, Ultra, "Don't know / Je ne sais pas"]
  - type: textarea
    id: log
    attributes:
      label: Log / Journal
      description: Paste the log copied by "Report a problem". / Collez le journal copié par « Signaler un problème ».
      render: text
