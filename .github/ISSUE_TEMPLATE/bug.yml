# Les champs que demande P1.33. Le journal vient du bouton « Report a problem » du menu (Général),
# qui le copie nettoyé : version, système, carte, pilote et préréglage en tête, chemins réduits au nom du fichier.
# Après un plantage, le rapport joint aussi la séance d'avant.
name: Bug report / Problème
description: Something does not work as expected. / Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / Ce qui se passe
      description: What you did, what you expected, what you saw. / Ce que vous avez fait, attendu, vu.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ajp version / Version
      placeholder: "0.11.0 (menu General, Application page)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System / Système
      options: [Windows 11, Linux, macOS]
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: System version / Version du système
      placeholder: "Windows 11 24H2, Fedora 43 KDE Wayland, macOS 15.5…"
  - type: input
    id: gpu
    attributes:
      label: Graphics card / Carte graphique
      placeholder: "RTX 4070, RX 7800 XT, Arc B580, M3…"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver / Pilote
      placeholder: "NVIDIA 590.12, Mesa 26.1, Adrenalin 26.3…"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / Moteur
      options: [Vulkan, TensorRT, Core ML, "Don't know / Je ne sais pas"]
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Quality level / Niveau
      options: [Auto, Economy / Économe, Fast / Rapide, Normal, Quality / Qualité, Ultra, Custom / Personnalisé, "Don't know / Je ne sais pas"]
  - type: input
    id: crash
    attributes:
      label: Crash? / Plantage ?
      description: |-
        If the player crashed, the report holds the previous session, with the build id of the program. Windows: keep
        the .dmp of the crashes folder (it may hold paths), we will ask for it privately. Linux: do NOT paste the output
        of "coredumpctl info ajp" (it holds your user name, the command line with the path of your video and the
        install folder). This line keeps the signal, the date and the build ids, without folders:
        coredumpctl info ajp | grep -E 'Signal:|Timestamp:|build-id' | sed -E 's#/[^ ]*/##g'
        / Si le lecteur a planté, le rapport contient la séance d'avant, avec l'identifiant de build du programme.
        Windows : gardez le .dmp du dossier crashes (il peut contenir des chemins), nous le demanderons en privé.
        Linux : ne collez PAS la sortie de « coredumpctl info ajp » (elle contient votre nom d'utilisateur, la ligne
        de commande avec le chemin de votre vidéo et le dossier d'installation). Cette ligne garde le signal, la date
        et les identifiants de build, sans dossiers :
        coredumpctl info ajp | grep -E 'Signal:|Timestamp:|build-id' | sed -E 's#/[^ ]*/##g'
  - type: textarea
    id: log
    attributes:
      label: Log / Journal
      description: Paste the log copied by "Report a problem". / Collez le journal copié par « Signaler un problème ».
      render: text
