# Les actions des workflows sont épinglées par SHA (tools/ci/check-pinned-actions.sh) : Dependabot
# propose chaque mois la nouvelle version, SHA et commentaire de version compris.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Les requirements à empreintes (tools/ci/requirements) : une alerte quand une version vieillit ou a une faille.
  - package-ecosystem: pip
    directory: /tools/ci/requirements
    schedule:
      interval: monthly
