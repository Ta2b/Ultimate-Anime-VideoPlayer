# Les cartes graphiques classées par puissance POUR Kirari, pas par date : ce qui compte est le débit des réseaux
# (SPAN, RIFE, GMFSS), surtout le calcul FP16 matriciel (cœurs Tensor sous TensorRT, matrices coopératives sous
# Vulkan). Une RTX 2060 y dépasse ainsi une GTX 1080 Ti, plus rapide en jeu mais sans unités matricielles. Le
# classement sert au préréglage Auto (docs/ux-parametres.md, 4.7) : ce sont des ESTIMATIONS, que le menu laisse
# changer (Vidéo > Général) ; docs/classement-gpu.md donne les chiffres et la méthode.
#
# Tranches, avec les noms du menu (gpu_tier.cpp, tier_label) et ce qu'Auto y règle (auto_config.cpp) :
#   0 Économe : grade HDR seul, ni agrandissement ni interpolation ;
#   1 Rapide  : agrandissement depuis 540p, interpolation jusqu'à ×2 ;
#   2 Normal  : agrandissement depuis 720p, interpolation jusqu'à ×3 ;
#   3 Qualité : la source jusqu'à 1080p avec les modèles fins, interpolation jusqu'à ×4 ;
#   4 Ultra   : comme Qualité, avec de la marge.
# Repère des seuils, en débit FP16 matriciel face à la RTX 4070 Ti (mesurée : 14,25 ms de SPAN b8f64 par image
# 1080p sous TensorRT) : Ultra à partir de 1,2 fois, Qualité de 0,7, Normal de 0,4, Rapide de 0,2. Les cartes
# sans unités matricielles (GTX, Radeon avant RDNA 3, Intel sans XMX) passent par Vulkan en FP32 ou FP16 simple,
# environ quatre fois moins efficace : Économe, sauf les plus fortes, en Rapide.
#
# La première règle dont le fabricant correspond et dont TOUTES les chaînes de `contains` se trouvent dans le
# nom (minuscules, sans « (tm) » ni « (r) ») gagne. D'où l'ordre : les portables d'abord (leur nom contient celui
# de la carte de bureau), puis les cartes de bureau de la plus puissante à la moins puissante, un nom plus long
# avant celui qu'il contient (« rtx 3060 ti » avant « rtx 3060 »), enfin les règles de famille pour les noms à
# venir. Une carte inconnue tombe sur l'estimation par fabricant, VRAM et unités matricielles (gpu_tier.cpp).
# `integrated = true` : iGPU (mémoire partagée avec le processeur).
version = 2

rules = [
  # ---- NVIDIA, portables : moins de watts que la carte de bureau du même nom ----------------------------------
  # « … Laptop GPU » depuis les RTX 30 ; les RTX 20 portables disent « with Max-Q Design » (A37-04) ou rien.
  # La RTX PRO 6000 « Max-Q Workstation Edition » est une carte de bureau (A37-12) : avant les règles Max-Q.
  { vendor = "nvidia", contains = ["rtx pro 6000"], tier = 4 },
  # Qualité (TensorRT recommandé)
  { vendor = "nvidia", contains = ["rtx 5090", "laptop"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 4090", "laptop"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 5080", "laptop"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 4080", "laptop"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx pro 5000", "laptop"], tier = 3 },
  # Normal (TensorRT recommandé)
  { vendor = "nvidia", contains = ["rtx 5070 ti", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 3080 ti", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 5070", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 4070", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 3080", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx pro 4000", "laptop"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 2080", "max-q"], tier = 2 },
  # Rapide (TensorRT recommandé) : 3070 Ti, 3070, 5060, 4060, 3060, 4050, 2070, 2060, 3050, RTX A… et PRO…
  # Laptop. L'A500 et l'A1000 portables restent ici : le Rapide tient sur 4 Go.
  { vendor = "nvidia", contains = ["rtx 2050"], tier = 0 },
  { vendor = "nvidia", contains = ["rtx", "laptop"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx", "max-q"], tier = 1 },
  # Économe (Vulkan) : les GTX et MX portables.
  { vendor = "nvidia", contains = ["gtx", "laptop"], tier = 0 },
  { vendor = "nvidia", contains = ["max-q"], tier = 0 },
  { vendor = "nvidia", contains = ["mx"], tier = 0 },

  # ---- NVIDIA, bureau, de la plus puissante à la moins puissante ---------------------------------------------
  # Ultra (TensorRT recommandé)
  { vendor = "nvidia", contains = ["rtx 5090"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 4090"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 6000 ada"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 5080"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx pro 5000"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 4080"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 4070 ti super"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 5070 ti"], tier = 4 },
  # Qualité (TensorRT recommandé) : la place de la 4070 Ti est mesurée, les autres suivent leur débit.
  { vendor = "nvidia", contains = ["rtx 4070 ti"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 3090 ti"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 5000 ada"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx pro 4500"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 3090"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 4070 super"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx a6000"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 3080 ti"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 5070"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 4500 ada"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx a5500"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx pro 4000"], tier = 3 },
  { vendor = "nvidia", contains = ["rtx 4070"], tier = 3 },
  # Normal (TensorRT recommandé). La 2080 Ti passe devant la 3060 Ti et la 4060 Ti : plus de cœurs Tensor.
  { vendor = "nvidia", contains = ["rtx 3080"], tier = 2 },
  { vendor = "nvidia", contains = ["titan rtx"], tier = 2 },
  { vendor = "nvidia", contains = ["quadro rtx 8000"], tier = 2 },
  { vendor = "nvidia", contains = ["quadro rtx 6000"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 2080 ti"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx a5000"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 3070 ti"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx a4500"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 4060 ti"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 5060 ti"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 2080"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 3070"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 4000 ada"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx a4000"], tier = 2 },
  { vendor = "nvidia", contains = ["quadro rtx 5000"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 5060"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx pro 2000"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 2070 super"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 3060 ti"], tier = 2 },
  # Rapide (TensorRT recommandé)
  { vendor = "nvidia", contains = ["rtx 4060"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 2070"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 2000 ada"], tier = 1 },
  { vendor = "nvidia", contains = ["quadro rtx 4000"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 2060 super"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 3060"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 2060"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 5050"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx a2000"], tier = 1 },
  { vendor = "nvidia", contains = ["quadro rtx 3000"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 3050"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx a1000"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx pro 1000"], tier = 1 },
  # Rapide (Vulkan) : les plus fortes sans cœurs Tensor, environ 11 TFLOPS FP32. À confirmer par une mesure.
  { vendor = "nvidia", contains = ["titan v"], tier = 1 },
  { vendor = "nvidia", contains = ["titan xp"], tier = 1 },
  { vendor = "nvidia", contains = ["titan x", "pascal"], tier = 1 },
  { vendor = "nvidia", contains = ["gtx 1080 ti"], tier = 1 },
  # Économe (Vulkan) : les autres GTX et GT, et les RTX à 4 Go de bureau les plus faibles.
  { vendor = "nvidia", contains = ["rtx a500"], tier = 0 },
  { vendor = "nvidia", contains = ["rtx a400"], tier = 0 },
  { vendor = "nvidia", contains = ["gtx"], tier = 0 },
  { vendor = "nvidia", contains = ["gt "], tier = 0 },
  { vendor = "nvidia", contains = ["titan"], tier = 0 },
  # Familles, pour les noms à venir (Quadro RTX avant « rtx 40 » et « rtx 50 », que leur nom contient).
  { vendor = "nvidia", contains = ["quadro rtx"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx pro"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 50"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 40"], tier = 2 },
  { vendor = "nvidia", contains = ["rtx 30"], tier = 1 },
  { vendor = "nvidia", contains = ["rtx 20"], tier = 1 },

  # ---- AMD (Vulkan) : RDNA 3 et 4 ont des matrices coopératives, les précédentes non ------------------------
  { vendor = "amd", contains = ["rx 9070"], tier = 3 },
  { vendor = "amd", contains = ["rx 7900"], tier = 3 },
  { vendor = "amd", contains = ["navi31"], tier = 3 },
  { vendor = "amd", contains = ["8060s"], tier = 2, integrated = true },
  { vendor = "amd", contains = ["gfx1151"], tier = 2, integrated = true },
  { vendor = "amd", contains = ["rx 9060"], tier = 2 },
  { vendor = "amd", contains = ["rx 7800"], tier = 2 },
  { vendor = "amd", contains = ["rx 7700"], tier = 2 },
  { vendor = "amd", contains = ["rx 69"], tier = 2 },
  { vendor = "amd", contains = ["rx 68"], tier = 2 },
  { vendor = "amd", contains = ["rx 7600"], tier = 1 },
  { vendor = "amd", contains = ["rx 67"], tier = 1 },
  { vendor = "amd", contains = ["rx 66"], tier = 1 },
  { vendor = "amd", contains = ["rx 5700"], tier = 1 },
  { vendor = "amd", contains = ["radeon vii"], tier = 1 },
  { vendor = "amd", contains = ["vega 64"], tier = 1 },
  { vendor = "amd", contains = ["vega 56"], tier = 1 },
  { vendor = "amd", contains = ["radeon 8"], tier = 1, integrated = true },
  { vendor = "amd", contains = ["rx 65"], tier = 0 },
  { vendor = "amd", contains = ["rx 64"], tier = 0 },
  { vendor = "amd", contains = ["rx 5"], tier = 0 },
  { vendor = "amd", contains = ["vega"], tier = 0 },
  { vendor = "amd", contains = ["rx 4"], tier = 0 },
  { vendor = "amd", contains = ["r9"], tier = 0 },
  { vendor = "amd", contains = ["radeon 7"], tier = 0, integrated = true },
  { vendor = "amd", contains = ["gfx1103"], tier = 0, integrated = true },
  { vendor = "amd", contains = ["radeon graphics"], tier = 0, integrated = true },

  # ---- Intel (Vulkan) : les Arc ont des unités XMX ------------------------------------------------------------
  { vendor = "intel", contains = ["arc", "b5"], tier = 2 },
  { vendor = "intel", contains = ["arc", "a7"], tier = 2 },
  { vendor = "intel", contains = ["arc", "a5"], tier = 1 },
  { vendor = "intel", contains = ["arc", "140"], tier = 1, integrated = true },
  { vendor = "intel", contains = ["arc", "a3"], tier = 0 },
  { vendor = "intel", contains = ["arc", "graphics"], tier = 0, integrated = true },
  { vendor = "intel", contains = ["iris xe"], tier = 0, integrated = true },
  { vendor = "intel", contains = ["uhd"], tier = 0, integrated = true },
  { vendor = "intel", contains = ["hd graphics"], tier = 0, integrated = true },
  { vendor = "intel", contains = ["iris"], tier = 0, integrated = true },

  # ---- Apple (Core ML, mémoire unifiée ; macOS n'est plus construit) ------------------------------------------
  { vendor = "apple", contains = ["ultra"], tier = 4, integrated = true },
  { vendor = "apple", contains = ["max"], tier = 3, integrated = true },
  { vendor = "apple", contains = ["pro"], tier = 3, integrated = true },
  { vendor = "apple", contains = ["apple m"], tier = 2, integrated = true },
]
