# Classement approximatif des cartes graphiques (et des iGPU) par tranche de performance, de 2015 à
# aujourd'hui. Il sert à choisir les réglages automatiques (docs/ux-parametres.md, 4.7) : ce sont des
# ESTIMATIONS, corrigées par « Évaluer ma machine ».
#
# Tranches : 0 Économe, 1 Léger, 2 Normal, 3 Rapide, 4 Ultra.
# La première règle dont le fabricant correspond et dont TOUTES les chaînes de `contains` se trouvent dans
# le nom (minuscules, sans « (tm) » ni « (r) ») gagne : du plus précis au plus général. Une carte inconnue
# tombe sur l'estimation par fabricant, VRAM et unités matricielles (gpu_tier.cpp).
# `integrated = true` : iGPU (mémoire partagée avec le processeur).
version = 1

rules = [
  # NVIDIA
  { vendor = "nvidia", contains = ["rtx 5090"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 5080"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 4090"], tier = 4 },
  { vendor = "nvidia", contains = ["rtx 4080"], tier = 4 },
